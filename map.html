        :root { --bg: #0f172a; --glass: rgba(30, 41, 59, 0.85); --accent: #fcd34d; --text: #fff; }

            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 50;
            display: flex; gap: 10px; height: 45px; pointer-events: none;
        }
        .glass-box {
            background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto;
            display: flex; align-items: center; justify-content: center;
        }
        .home-btn { width: 45px; color: #fff; font-size: 18px; text-decoration: none; }
        .search-container { flex: 1; padding: 0 10px; justify-content: flex-start; }
        .search-input { width: 100%; background: transparent; border: none; color: #fff; font-size: 14px; outline: none; }
        .menu-btn { width: 45px; color: var(--accent); font-size: 18px; cursor: pointer; }

        /* [3. 내 위치 버튼] */
        .my-loc-btn {
            position: absolute; bottom: 30px; right: 20px; z-index: 50;
            width: 45px; height: 45px; border-radius: 50%; background: #6366f1; border: none; 
            color: white; font-size: 20px; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.6); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* [4. 말풍선 (Info Window) - 항시 노출용 컴팩트 디자인] */
        .info-window {
            position: relative; bottom: 55px; /* 마커보다 좀 더 위로 */
            background: rgba(15, 23, 42, 0.9); /* 좀 더 진하게 */
            color: #fff; padding: 12px; border-radius: 12px;
            width: 180px; text-align: center; border: 1px solid rgba(252, 211, 77, 0.5);
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }
        /* 말풍선 꼬리 */
        .info-window::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            border-width: 8px 8px 0; border-style: solid; border-color: rgba(15, 23, 42, 0.9) transparent transparent transparent;
        }
        
        .iw-title { font-size: 15px; font-weight: 900; color: #fff; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        /* 명당 파워 박스 (강조) */
        .iw-power-box {
            background: linear-gradient(90deg, rgba(252, 211, 77, 0.1), rgba(255, 71, 87, 0.1));
            border: 1px solid var(--accent); padding: 5px 0; border-radius: 6px; margin-bottom: 8px;
        }
        .iw-power-val { font-size: 16px; font-weight: 900; color: var(--accent); }
        .iw-power-label { font-size: 10px; color: #cbd5e1; }

        .iw-stats-grid { display: flex; justify-content: space-around; margin-bottom: 8px; font-size: 11px; color: #cbd5e1; }
        .iw-stats-grid b { color: #fff; font-size: 12px; }

        /* 주소 복사 버튼 */
        .iw-copy-btn {
            width: 100%; background: #334155; color: #fff; border: none; padding: 6px 0;
            border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; transition: background 0.2s;
        }
        .iw-copy-btn:hover { background: #475569; }

        /* [5. 사이드 메뉴] */
        .side-menu {
            position: absolute; top: 0; right: -300px; width: 280px; height: 100%;
            background: var(--glass); z-index: 300; transition: right 0.3s; padding: 20px; 
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        .side-menu.open { right: 0; }
        .menu-list a { display: block; padding: 15px 0; color: #cbd5e1; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* 토스트 */
        #toast {
            visibility: hidden; min-width: 200px; background: rgba(0,0,0,0.9); color: #fff; text-align: center;
            border-radius: 8px; padding: 12px; position: fixed; z-index: 400; left: 50%; bottom: 90px;
            transform: translateX(-50%); font-size: 14px; border: 1px solid #334155;
        }
        #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.5s 2.0s; }
        @keyframes fadein { from {bottom: 50px; opacity: 0;} to {bottom: 90px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 90px; opacity: 1;} to {bottom: 50px; opacity: 0;} }

                zIndex: 10
            });
            
            // 오버레이 배열에 저장 (store 정보와 함께)
            overlays.push({ overlay: overlay, position: position });

            return marker;
        });

        // 클러스터러에 마커 추가
        clusterer.addMarkers(markers);

        // 🔄 줌 레벨 변경 시 오버레이 표시/숨김 처리 함수
        function updateOverlays() {
            var level = map.getLevel();
            
            // 레벨 6 이하(확대됨)일 때만 오버레이 표시
            // 클러스터러 minLevel(7)과 맞춰야 자연스러움
            if (level < 8) { 
                overlays.forEach(item => item.overlay.setMap(map));
            } else {
                overlays.forEach(item => item.overlay.setMap(null));
            }
        }

        // 이벤트 리스너 등록 (줌 변경 시 & 지도 이동 후)
        kakao.maps.event.addListener(map, 'zoom_changed', updateOverlays);
        kakao.maps.event.addListener(map, 'idle', updateOverlays);

        // 초기 실행
        updateOverlays();


        // 기능들
        function toggleMenu() { document.getElementById('side-menu').classList.toggle('open'); }
        
        function searchStore() {
            const kw = document.getElementById('keyword').value;
            if(!kw) return;
            const found = stores.find(s => s.name.includes(kw) || s.addr.includes(kw));
            if(found) {
                map.setLevel(4); // 확대
                map.panTo(new kakao.maps.LatLng(found.lat, found.lng));
                showToast(`📍 ${found.name} 위치로 이동했습니다.`);
            } else { showToast("목록에 없습니다."); }
        }

        function copyAddr(txt) {
            navigator.clipboard.writeText(txt);
            showToast("주소가 복사되었습니다! 📋");
        }

        function showToast(msg) {
            var t = document.getElementById("toast"); t.innerText = msg; t.className = "show";
            setTimeout(() => t.className = t.className.replace("show", ""), 2500);
        }

        function moveToCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    var lat = pos.coords.latitude; var lon = pos.coords.longitude;
                    var loc = new kakao.maps.LatLng(lat, lon);
                    map.setLevel(5); map.panTo(loc);
                    new kakao.maps.Marker({ position: loc, map: map });
                });
            } else { alert("GPS 권한을 켜주세요."); }
        }
    </script>
</body>
</html>
