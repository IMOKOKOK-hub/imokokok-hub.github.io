<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>호들갑 명당 지도</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" href="favicon.png">

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=cf95e23dab0df4c6d229a734e0180def&libraries=services,clusterer"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* 1. 기본 스타일 (다크 모드) */
        body { margin: 0; background: #0f172a; color: #fff; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        
        /* 2. 지도 전체 화면 */
        #map { width: 100%; height: 100vh; }

        /* 3. 상단 헤더 (검색창 포함) - 유리창 효과 */
        .map-header {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 100;
            display: flex; gap: 10px; align-items: center; pointer-events: none; /* 클릭 통과 방지용 */
        }
        
        /* 공통 유리창 스타일 */
        .glass-box {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: auto; /* 다시 클릭 가능하게 */
        }

        /* 홈 버튼 */
        .home-btn {
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; text-decoration: none; color: #fff; flex-shrink: 0;
        }

        /* 검색창 영역 */
        .search-container {
            flex: 1; display: flex; align-items: center; padding: 0 5px; height: 45px;
        }
        .region-select {
            background: #334155; color: #fff; border: none; border-radius: 6px;
            padding: 5px; font-size: 12px; margin-right: 5px; outline: none; height: 32px;
        }
        .search-input {
            flex: 1; background: transparent; border: none; color: #fff; font-size: 14px;
            outline: none; padding: 0 5px; min-width: 0; /* 모바일 깨짐 방지 */
        }
        .search-btn {
            background: none; border: none; color: #fcd34d; font-size: 16px; padding: 0 10px; cursor: pointer;
        }

        /* 메뉴 버튼 (랭킹 보기) */
        .menu-btn {
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fcd34d; border: 1px solid #fcd34d; cursor: pointer; flex-shrink: 0;
        }

        /* 4. 내 위치 버튼 (우측 하단) */
        .loc-btn {
            position: absolute; bottom: 30px; right: 15px; z-index: 100;
            width: 45px; height: 45px; font-size: 20px;
            background: #6366f1; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .loc-btn:active { transform: scale(0.95); }

        /* 5. 슬라이드 메뉴 (랭킹 전용) */
        .side-menu {
            position: absolute; top: 0; right: -320px; width: 280px; height: 100%;
            background: rgba(15, 23, 42, 0.98); z-index: 200;
            border-left: 1px solid rgba(255,255,255,0.1);
            transition: right 0.3s ease-in-out;
            display: flex; flex-direction: column;
        }
        .side-menu.open { right: 0; }

        .menu-header-area {
            padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            font-size: 16px; font-weight: bold; color: #fcd34d;
        }
        .close-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .menu-content { flex: 1; overflow-y: auto; padding: 15px; }

        /* 랭킹 리스트 스타일 */
        .rank-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; background: #1e293b; border-radius: 8px; margin-bottom: 8px;
            cursor: pointer; border: 1px solid transparent;
        }
        .rank-item:hover { border-color: #fcd34d; }
        .rank-badge { background: #fcd34d; color: #000; font-weight: bold; font-size: 12px; width: 20px; height: 20px; border-radius: 4px; display:flex; align-items:center; justify-content:center; margin-right: 10px; }
        
        .report-btn {
            margin-top: 20px; width: 100%; padding: 15px; background: #334155; color: #cbd5e1;
            border: 1px dashed rgba(255,255,255,0.3); border-radius: 8px; cursor: pointer; text-align: center; font-size: 13px;
        }

        /* 6. 지도 말풍선 (Info Window) */
        .info-window {
            position: relative; bottom: 50px;
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(5px);
            color: #fff; padding: 15px; border-radius: 12px; width: 220px; text-align: center;
            border: 1px solid #fcd34d; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .info-window::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            border-width: 8px 8px 0; border-style: solid; border-color: #fcd34d transparent transparent transparent;
        }
        .power-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none;
            padding: 8px 0; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 0 #b45309; transition: all 0.1s;
        }
        .power-btn:active { transform: translateY(4px); box-shadow: none; }

        /* 토스트 메시지 */
        #toast {
            visibility: hidden; min-width: 200px; background-color: rgba(0,0,0,0.8); color: #fff; text-align: center;
            border-radius: 8px; padding: 12px; position: fixed; z-index: 300; left: 50%; bottom: 80px;
            transform: translateX(-50%); font-size: 14px; backdrop-filter: blur(4px);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.0s; }
        @keyframes fadein { from {bottom: 50px; opacity: 0;} to {bottom: 80px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 80px; opacity: 1;} to {bottom: 50px; opacity: 0;} }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="map-header">
        <a href="index.html" class="glass-box home-btn"><i class="fas fa-home"></i></a>
        
        <div class="glass-box search-container">
            <select class="region-select" onchange="moveRegion(this.value)">
                <option value="">지역</option>
                <option value="seoul">서울</option>
                <option value="busan">부산</option>
                <option value="daegu">대구</option>
                <option value="incheon">인천</option>
                <option value="gyeonggi">경기</option>
                <option value="jeju">제주</option>
                <option value="daejeon">대전</option>
                <option value="gwangju">광주</option>
            </select>
            <input type="text" id="keyword" class="search-input" placeholder="동네/가게명" onkeyup="if(window.event.keyCode==13){searchStore()}">
            <button class="search-btn" onclick="searchStore()"><i class="fas fa-search"></i></button>
        </div>

        <button class="glass-box menu-btn" onclick="toggleMenu()">
            <i class="fas fa-trophy"></i>
        </button>
    </div>

    <button class="glass-box loc-btn" onclick="moveToCurrentLocation()">
        <i class="fas fa-crosshairs"></i>
    </button>

    <div id="side-menu" class="side-menu">
        <div class="menu-header-area">
            <span>⚡ 명당 파워 랭킹</span>
            <button class="close-btn" onclick="toggleMenu()">&times;</button>
        </div>
        
        <div class="menu-content">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:15px;">
                * 1등 배출 횟수와 호들갑 유저들의 기운을 합산한 순위입니다.
            </div>

            <div id="ranking-list">
                </div>

            <div class="report-btn" onclick="alert('준비 중입니다! 곧 사장님께 직접 제보할 수 있어요.')">
                📢 우리 동네 명당 제보하기
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // ============================================
        // 🛠️ 1. 데이터 (전설의 명당 리스트)
        // ============================================
        // ✅ 전국 전설의 로또 명당 TOP 15
        var stores = [
            { name: "스파 편의점", addr: "서울 노원구 동일로 1493", lat: 37.6565, lng: 127.0620, win1: 52, win2: 210, user_power: 150 },
            { name: "부일 카서비스", addr: "부산 동구 자성로133번길 35", lat: 35.1245, lng: 129.0965, win1: 49, win2: 180, user_power: 80 },
            { name: "일산 잭팟", addr: "경기 고양시 일산서구 중앙로 1493", lat: 37.6765, lng: 126.7470, win1: 22, win2: 85, user_power: 45 },
            { name: "잠실 매점", addr: "서울 송파구 올림픽로 269", lat: 37.5148, lng: 127.1009, win1: 19, win2: 70, user_power: 200 },
            { name: "로또명당 인주점", addr: "충남 아산시 인주면 서해로 519-1", lat: 36.8879, lng: 126.9080, win1: 28, win2: 105, user_power: 60 },
            { name: "목동 식품", addr: "서울 중랑구 동일로 919", lat: 37.6087, lng: 127.0762, win1: 18, win2: 60, user_power: 10 },
            { name: "제이 복권방", addr: "서울 종로구 종로 225-1", lat: 37.5707, lng: 127.0039, win1: 16, win2: 55, user_power: 5 },
            { name: "세진전자통신", addr: "대구 서구 서대구로 156", lat: 35.8732, lng: 128.5583, win1: 18, win2: 68, user_power: 30 },
            { name: "상남 슈퍼", addr: "경남 창원시 성산구 마디미로 37", lat: 35.2215, lng: 128.6830, win1: 16, win2: 50, user_power: 25 },
            { name: "복권 나라", addr: "서울 관악구 남부순환로 1739-9", lat: 37.4821, lng: 126.9388, win1: 15, win2: 45, user_power: 15 },
            { name: "행운 복권방", addr: "경기 포천시 소흘읍 죽엽산로 34", lat: 37.8080, lng: 127.1650, win1: 14, win2: 40, user_power: 20 },
            { name: "뉴빅마트", addr: "부산 기장군 정관읍 정관로 512", lat: 35.3235, lng: 129.1765, win1: 13, win2: 38, user_power: 5 },
            { name: "CU 수성점", addr: "대구 수성구 들안로 266", lat: 35.8504, lng: 128.6210, win1: 12, win2: 35, user_power: 10 },
            { name: "대운 복권", addr: "광주 북구 서암대로 23", lat: 35.1705, lng: 126.9080, win1: 12, win2: 30, user_power: 8 },
            { name: "인터넷 복권 판매", addr: "공식 홈페이지", lat: 37.4830, lng: 127.0110, win1: 20, win2: 150, user_power: 500 }
        ];

        // ⚡ 명당 파워 계산 공식: (1등x100) + (유저기운)
        stores.forEach(s => s.total_power = (s.win1 * 100) + (s.user_power || 0));
        stores.sort((a, b) => b.total_power - a.total_power); // 파워 높은 순 정렬

        // ============================================
        // 🗺️ 2. 지도 초기화
        // ============================================
        var mapContainer = document.getElementById('map');
        var mapOption = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 9 };
        var map = new kakao.maps.Map(mapContainer, mapOption);

        // 클러스터러 (어지러움 방지)
        var clusterer = new kakao.maps.MarkerClusterer({
            map: map, averageCenter: true, minLevel: 6,
            calculator: [5, 10, 20],
            styles: [{
                width : '40px', height : '40px', background: 'rgba(99, 102, 241, 0.9)',
                borderRadius: '50%', color: '#fff', textAlign: 'center', fontWeight: 'bold', lineHeight: '40px'
            }]
        });

        // ============================================
        // 📍 3. 마커 & 랭킹 생성
        // ============================================
        var markers = [];
        var activeOverlay = null;

        // 메뉴판에 랭킹 리스트 그리기 (TOP 10)
        var rankHTML = "";
        stores.slice(0, 10).forEach((s, index) => {
            rankHTML += `
                <div class="rank-item" onclick="selectStoreFromMenu(${s.lat}, ${s.lng})">
                    <div style="display:flex; align-items:center;">
                        <span class="rank-badge">${index+1}</span>
                        <div style="display:flex; flex-direction:column;">
                            <span style="font-size:14px; font-weight:bold; color:#fff;">${s.name}</span>
                            <span style="font-size:11px; color:#94a3b8;">1등 ${s.win1}회 / 2등 ${s.win2}회</span>
                        </div>
                    </div>
                    <span style="color:#fcd34d; font-weight:bold; font-size:13px;">⚡${s.total_power}</span>
                </div>
            `;
        });
        document.getElementById('ranking-list').innerHTML = rankHTML;

        // 지도에 마커 찍기
        stores.forEach((store) => {
            var position = new kakao.maps.LatLng(store.lat, store.lng);
            
            // 왕관 쓴 이미지 (상위권), 나머지는 일반
            var isTop = store.total_power > 4000; 
            var imageSrc = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png"; 
            var imageSize = new kakao.maps.Size(24, 35); 
            var marker = new kakao.maps.Marker({ position: position, image: new kakao.maps.MarkerImage(imageSrc, imageSize) });

            // 마커 클릭 시 말풍선
            kakao.maps.event.addListener(marker, 'click', function() {
                closeOverlay(); // 기존 꺼 닫기

                var content = `
                    <div class="info-window">
                        <div style="font-size:16px; font-weight:bold; color:#fcd34d; margin-bottom:5px;">${store.name}</div>
                        <div style="font-size:12px; color:#cbd5e1; margin-bottom:10px;">
                            ${store.addr}
                        </div>
                        <div style="display:flex; justify-content:space-around; margin-bottom:10px; font-size:12px;">
                            <span>🥇 1등: <b>${store.win1}</b></span>
                            <span>⚡ 파워: <b>${store.total_power}</b></span>
                        </div>
                        <button class="power-btn" onclick="givePower('${store.name}')">
                            ⚡ 기운 불어넣기 (+1)
                        </button>
                        <div style="font-size:10px; color:#64748b; margin-top:5px; cursor:pointer; text-decoration:underline;" onclick="copyAddress('${store.addr}')">주소 복사하기</div>
                    </div>
                `;

                var overlay = new kakao.maps.CustomOverlay({
                    content: content, map: map, position: marker.getPosition(), yAnchor: 1.4, zIndex: 10
                });
                
                activeOverlay = overlay;
                map.panTo(position);
            });

            markers.push(marker);
        });
        clusterer.addMarkers(markers);

        // 지도 빈 곳 클릭 시 닫기
        kakao.maps.event.addListener(map, 'click', closeOverlay);

        // ============================================
        // 🚀 4. 기능 함수들
        // ============================================
        
        // 메뉴 열기/닫기
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
        }

        // 말풍선 닫기
        function closeOverlay() {
            if (activeOverlay) {
                activeOverlay.setMap(null);
                activeOverlay = null;
            }
        }

        // 메뉴에서 가게 클릭 시
        function selectStoreFromMenu(lat, lng) {
            map.setLevel(4);
            map.panTo(new kakao.maps.LatLng(lat, lng));
            toggleMenu(); // 메뉴 닫기
        }

        // 기운 불어넣기 (시각적 효과)
        function givePower(name) {
            showToast(`✨ '${name}'에 기운을 보냈습니다!`);
        }

        // 주소 복사
        function copyAddress(addr) {
            navigator.clipboard.writeText(addr).then(() => {
                showToast("주소가 복사되었습니다! 📋");
            });
        }

        // 토스트 메시지
        function showToast(msg) {
            var x = document.getElementById("toast");
            x.innerText = msg;
            x.className = "show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 2500);
        }

        // 지역 이동
        function moveRegion(region) {
            var locs = {
                'seoul': [37.5665, 126.9780], 'busan': [35.1795, 129.0749],
                'daegu': [35.8714, 128.6014], 'incheon': [37.4562, 126.7052],
                'gyeonggi': [37.2750, 127.0094], 'jeju': [33.4996, 126.5311],
                'daejeon': [36.3504, 127.3845], 'gwangju': [35.1595, 126.8526]
            };
            if(locs[region]) {
                map.setLevel(8);
                map.panTo(new kakao.maps.LatLng(locs[region][0], locs[region][1]));
            }
        }

        // 검색
        function searchStore() {
            var keyword = document.getElementById('keyword').value;
            if (!keyword) return;
            var found = stores.find(s => s.name.includes(keyword) || s.addr.includes(keyword));
            if (found) {
                // 찾으면 바로 확대 이동
                map.setLevel(4);
                map.panTo(new kakao.maps.LatLng(found.lat, found.lng));
            } else {
                alert('목록에 없는 명당입니다. (TOP 15 명당만 등록되어 있습니다)');
            }
        }

        // 내 위치
        function moveToCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude; 
                    var lon = position.coords.longitude; 
                    var locPosition = new kakao.maps.LatLng(lat, lon); 
                    map.setLevel(5);
                    map.panTo(locPosition);
                    // 내 위치 마커 (파란색 기본 마커 사용)
                    var marker = new kakao.maps.Marker({ position: locPosition });
                    marker.setMap(map);
                });
            } else {
                alert('GPS 권한을 허용해주세요!');
            }
        }
    </script>
</body>
</html>
