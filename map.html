<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전설의 로또 명당 지도 - 호들갑 LAB</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" href="favicon.png">

    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=cf95e23dab0df4c6d229a734e0180def&libraries=services"></script>
    
    <style>
        body { margin: 0; background: #0f172a; color: #fff; font-family: sans-serif; }
        
        /* 헤더 스타일 */
        .map-header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            background: rgba(15, 23, 42, 0.9); padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .home-btn { 
            text-decoration: none; color: #fff; background: rgba(255,255,255,0.1); 
            padding: 8px 12px; border-radius: 8px; font-size: 13px; 
        }

        #map { width: 100%; height: 100vh; }
        
        /* 말풍선 스타일 */
        .info-window { 
            padding: 12px; background: #1e293b; color: #fff; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-size: 13px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1); min-width: 150px;
        }
        .score { color: #fcd34d; font-weight: bold; font-size: 16px; margin: 5px 0; }
        .badge { background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight:bold; }
    </style>
</head>
<body>

    <div class="map-header">
        <div style="font-weight:bold; font-size:16px;">🗺️ 명당 지도</div>
        <a href="index.html" class="home-btn">🏠 홈으로</a>
    </div>

    <div id="map"></div>

    <script>
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(37.6565, 127.0620), // 초기 중심 (스파 편의점)
            level: 8
        };
        var map = new kakao.maps.Map(container, options);

        // ✅ 명당 데이터 (일단 샘플 2개, 나중에 파이썬으로 뽑은거 덮어쓰기)
        var stores = [
            { name: "스파 편의점 (전국 1위)", lat: 37.6565, lng: 127.0620, win1: 50, rating: 4.9 },
            { name: "부일 카서비스 (부산 1위)", lat: 35.1245, lng: 129.0965, win1: 45, rating: 4.8 },
            { name: "일산 잭팟", lat: 37.6534, lng: 126.7750, win1: 20, rating: 4.5 }
        ];

        // 마커 찍기
        stores.forEach(store => {
            // 명당 점수 (1등 횟수 x 100)
            let score = store.win1 * 100;

            var markerPosition  = new kakao.maps.LatLng(store.lat, store.lng); 
            
            // 마커 이미지 (황금색 느낌)
            var imageSrc = "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png"; 
            var imageSize = new kakao.maps.Size(24, 35); 
            var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize); 

            var marker = new kakao.maps.Marker({
                position: markerPosition,
                image: markerImage,
                map: map
            });

            // 말풍선 내용
            var content = `
                <div class="info-window">
                    <div style="font-size:14px; font-weight:bold; margin-bottom:4px;">${store.name}</div>
                    <span class="badge">1등 ${store.win1}회 배출</span>
                    <div class="score">⚡ 기운: ${score}점</div>
                </div>
            `;

            // 마커 클릭 시 말풍선 열기/닫기
            var overlay = new kakao.maps.CustomOverlay({
                content: content,
                map: map,
                position: marker.getPosition(),
                yAnchor: 2.2
            });
            
            // 기본적으로 띄워둠 (클릭 이벤트로 바꿔도 됨)
            overlay.setMap(map);
        });
    </script>
</body>
</html>
