<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 3 Prompt Lab (Supabase)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 🎨 디자인: 다크모드 + 제미나이 퍼플 */
        :root { --bg: #09090b; --card-bg: #18181b; --border: #27272a; --text: #e4e4e7; --sub: #a1a1aa; --accent: #8b5cf6; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding-bottom: 100px; }
        
        /* 헤더 & 네비게이션 */
        .nav-bar { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(9,9,11,0.9); position: sticky; top: 0; z-index: 50; }
        .nav-link { color: var(--sub); text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .nav-link:hover { color: var(--accent); }
        
        .header { text-align: center; padding: 60px 20px 40px; }
        .header h1 { margin: 0; background: linear-gradient(to right, #c4b5fd, #8b5cf6); -webkit-background-clip: text; color: transparent; font-size: 3rem; letter-spacing: -1px; }
        .header p { color: var(--sub); margin-top: 10px; }

        /* 카드 그리드 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; transition: 0.2s; cursor: pointer; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .tag { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; background: #333; color: white; align-self: flex-start; margin-bottom: 15px; }
        .tag.CODING { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .tag.WRITING { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag.LOGIC { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .tag.IMAGE { background: rgba(236, 72, 153, 0.2); color: #f472b6; }

        .card-content { flex-grow: 1; }
        .card h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .card p { color: var(--sub); font-size: 0.9rem; line-height: 1.5; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .card-footer { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; color: var(--sub); font-size: 0.85rem; border-top: 1px solid #333; padding-top: 15px; }
        .likes { display: flex; align-items: center; gap: 5px; }
        .likes i { color: #ef4444; }

        /* 업로드 버튼 (플로팅) */
        .fab { position: fixed; bottom: 30px; right: 30px; background: var(--accent); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); cursor: pointer; transition: 0.2s; border: none; z-index: 100; }
        .fab:hover { transform: scale(1.1) rotate(90deg); }

        /* 모달 (공통) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 200; display: none; justify-content: center; align-items: center; }
        .modal-box { background: #18181b; width: 90%; max-width: 600px; border-radius: 20px; border: 1px solid var(--border); padding: 30px; position: relative; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 50px rgba(139, 92, 246, 0.2); }
        .close-icon { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--sub); }
        
        /* 상세 보기 전용 */
        .prompt-code { background: #000; padding: 15px; border-radius: 8px; border: 1px solid #333; color: #d4d4d8; font-family: monospace; white-space: pre-wrap; margin: 20px 0; max-height: 300px; overflow-y: auto; }
        .action-btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; display: flex; justify-content: center; gap: 10px; align-items: center; }
        .btn-copy { background: var(--accent); color: white; }
        .btn-copy:hover { background: #7c3aed; }

        /* 글쓰기 전용 */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--sub); font-size: 0.9rem; }
        .input-field { width: 100%; padding: 12px; background: #09090b; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        .input-area { height: 120px; resize: none; font-family: monospace; }
        .btn-submit { background: var(--accent); color: white; }

        #loader { text-align: center; padding: 40px; color: var(--sub); }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a href="index.html" class="nav-link"><i class="fas fa-chevron-left"></i> 호들갑 LAB</a>
        <div style="font-size:0.9rem; color:#666;">Powered by Supabase ⚡</div>
    </nav>

    <header class="header">
        <h1>Gemini 3 Prompt Lab</h1>
        <p>Expert Prompts for Next-Gen AI</p>
    </header>

    <div id="loader"><i class="fas fa-spinner fa-spin"></i> 프롬프트 로딩 중...</div>
    <div class="grid" id="promptGrid"></div>

    <button class="fab" onclick="openUploadModal()"><i class="fas fa-plus"></i></button>

    <div id="viewModal" class="modal-overlay" onclick="closeModal(event, 'viewModal')">
        <div class="modal-box">
            <i class="fas fa-times close-icon" onclick="document.getElementById('viewModal').style.display='none'"></i>
            <span id="v-tag" class="tag">TAG</span>
            <h2 id="v-title" style="margin: 10px 0;">Title</h2>
            <p id="v-desc" style="color:var(--sub); line-height:1.6;">Description</p>
            
            <div class="prompt-code" id="v-content">Prompt Content...</div>
            
            <button class="action-btn btn-copy" onclick="copyPrompt()">
                <i class="fas fa-copy"></i> 프롬프트 복사
            </button>
        </div>
    </div>

    <div id="uploadModal" class="modal-overlay" onclick="closeModal(event, 'uploadModal')">
        <div class="modal-box">
            <i class="fas fa-times close-icon" onclick="document.getElementById('uploadModal').style.display='none'"></i>
            <h2 style="margin-top:0;">📝 프롬프트 공유</h2>
            
            <div class="input-group">
                <label>제목 (Title)</label>
                <input type="text" id="in-title" class="input-field" placeholder="예: 시니어 개발자 페르소나">
            </div>
            <div class="input-group">
                <label>설명 (Description)</label>
                <input type="text" id="in-desc" class="input-field" placeholder="이 프롬프트는 어떤 효과가 있나요?">
            </div>
            <div class="input-group">
                <label>태그 (Category)</label>
                <select id="in-tag" class="input-field">
                    <option value="CODING">CODING</option>
                    <option value="WRITING">WRITING</option>
                    <option value="LOGIC">LOGIC</option>
                    <option value="IMAGE">IMAGE</option>
                </select>
            </div>
            <div class="input-group">
                <label>프롬프트 내용 (Content)</label>
                <textarea id="in-content" class="input-field input-area" placeholder="AI에게 입력할 진짜 명령어를 적어주세요."></textarea>
            </div>

            <button class="action-btn btn-submit" onclick="uploadPrompt()">업로드 (Upload)</button>
        </div>
    </div>

    <script>
        // ✅ 사용자님이 주신 키를 여기에 정확히 넣었습니다!
        const supabaseUrl = 'https://sqbxawmpzknseksnicne.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxYnhhd21wemtuc2Vrc25pY25lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3Nzg0NjQsImV4cCI6MjA4NDM1NDQ2NH0.NsRS31_yv-eHbrpu4_dSo-xcC3zXl6NTIH3OiZrJz6U'; 

        // 수퍼베이스 클라이언트 생성
        const { createClient } = supabase;
        const _supabase = createClient(supabaseUrl, supabaseKey);

        // 1. 프롬프트 불러오기 (Read)
        async function loadPrompts() {
            const grid = document.getElementById('promptGrid');
            const loader = document.getElementById('loader');
            
            try {
                // DB에서 데이터 가져오기 (최신순 정렬)
                let { data: prompts, error } = await _supabase
                    .from('prompts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loader.style.display = 'none';
                grid.innerHTML = '';

                if (!prompts || prompts.length === 0) {
                    grid.innerHTML = '<p style="text-align:center; color:#666; width:100%;">아직 등록된 프롬프트가 없습니다. 첫 글을 남겨보세요!</p>';
                    return;
                }

                prompts.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openViewModal(p);
                    card.innerHTML = `
                        <span class="tag ${p.tag}">${p.tag}</span>
                        <div class="card-content">
                            <h3>${p.title}</h3>
                            <p>${p.description}</p>
                        </div>
                        <div class="card-footer">
                            <span>${new Date(p.created_at).toLocaleDateString()}</span>
                            <div class="likes"><i class="fas fa-heart"></i> ${p.likes}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error('Error:', err);
                loader.innerHTML = '데이터 로딩 실패 (잠시 후 다시 시도하세요)';
            }
        }

        // 2. 프롬프트 업로드 (Create)
        async function uploadPrompt() {
            const title = document.getElementById('in-title').value;
            const desc = document.getElementById('in-desc').value;
            const tag = document.getElementById('in-tag').value;
            const content = document.getElementById('in-content').value;

            if (!title || !content) return alert('제목과 내용은 필수입니다!');

            const btn = document.querySelector('.btn-submit');
            const originalText = btn.innerText;
            btn.innerText = "저장 중...";

            try {
                const { error } = await _supabase
                    .from('prompts')
                    .insert([
                        { title: title, description: desc, tag: tag, content: content }
                    ]);

                if (error) throw error;

                alert('업로드 완료! 🎉');
                document.getElementById('uploadModal').style.display = 'none';
                
                // 입력창 초기화
                document.getElementById('in-title').value = '';
                document.getElementById('in-desc').value = '';
                document.getElementById('in-content').value = '';
                
                // 목록 새로고침
                loadPrompts();

            } catch (err) {
                console.error('Error:', err);
                alert('업로드 실패: ' + err.message);
            } finally {
                btn.innerText = originalText;
            }
        }

        // 3. UI 제어 함수들
        function openViewModal(data) {
            const modal = document.getElementById('viewModal');
            document.getElementById('v-title').innerText = data.title;
            document.getElementById('v-tag').innerText = data.tag;
            document.getElementById('v-tag').className = `tag ${data.tag}`;
            document.getElementById('v-desc').innerText = data.description;
            document.getElementById('v-content').innerText = data.content;
            modal.style.display = 'flex';
        }

        function openUploadModal() {
            document.getElementById('uploadModal').style.display = 'flex';
        }

        function closeModal(e, modalId) {
            if (e.target.id === modalId) {
                document.getElementById(modalId).style.display = 'none';
            }
        }

        function copyPrompt() {
            const text = document.getElementById('v-content').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.innerHTML = '<i class="fas fa-check"></i> 복사 완료!';
                setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> 프롬프트 복사', 2000);
            });
        }

        // 실행
        loadPrompts();

    </script>
</body>
</html>
