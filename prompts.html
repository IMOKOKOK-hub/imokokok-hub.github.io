    <style>
        /* --- [1] 디자인 스타일 --- */
        :root {
            --bg: #09090b; --card-bg: #18181b; --border: #27272a;
            --text-main: #e4e4e7; --text-sub: #a1a1aa;
            --accent: #8b5cf6; --accent-glow: rgba(139, 92, 246, 0.3);
        }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        .header { text-align: center; padding: 80px 20px; background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 70%); position: relative; }
        .header h1 { font-size: 3.5rem; margin: 0; background: linear-gradient(to right, #c4b5fd, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; letter-spacing: -1px; }
        .header p { color: var(--text-sub); font-size: 1.2rem; margin-top: 10px; max-width: 600px; margin: 10px auto; }
        .back-nav { position: absolute; top: 20px; left: 20px; color: var(--text-sub); text-decoration: none; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .back-nav:hover { color: var(--accent); }

        .controls { max-width: 1000px; margin: 0 auto 40px auto; padding: 0 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .search-bar { flex: 1; background: var(--card-bg); border: 1px solid var(--border); padding: 15px 20px; border-radius: 12px; color: white; font-size: 1rem; outline: none; transition: 0.3s; }
        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub); padding: 10px 20px; border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .filter-btn:hover, .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; padding: 0 20px 80px 20px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; transition: transform 0.2s; position: relative; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 15px; }
        .tag-coding { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .tag-writing { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-logic { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .tag-image { background: rgba(236, 72, 153, 0.2); color: #f472b6; }

        .card h3 { margin: 0 0 10px 0; font-size: 1.3rem; }
        .card p { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }
        
        .prompt-box { background: #000; padding: 15px; border-radius: 8px; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #d4d4d8; height: 100px; overflow-y: auto; margin-bottom: 15px; border: 1px solid #333; white-space: pre-wrap; }
        .prompt-box::-webkit-scrollbar { width: 6px; }
        .prompt-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        .copy-btn { background: var(--text-main); color: black; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; width: 100%; }
        .copy-btn:hover { background: var(--accent); color: white; }

        .fab { position: fixed; bottom: 40px; right: 40px; background: var(--accent); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; box-shadow: 0 0 20px var(--accent-glow); cursor: pointer; transition: 0.3s; border: none; z-index: 100; }
        .fab:hover { transform: scale(1.1) rotate(90deg); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-box {
            background: #18181b;
            width: 95%;
            max-width: 1000px; /* 👈 기존 500px에서 1000px로 변경! */
            padding: 40px;     /* 여백도 30px -> 40px로 늘리면 더 시원함 */
            border-radius: 20px;
            border: 1px solid var(--border);
            position: relative;
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-icon { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; cursor: pointer; color: var(--text-sub); }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-sub); font-size: 0.9rem; }
        .input-field { width: 100%; padding: 12px; background: #09090b; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; outline: none; }
        .input-field:focus { border-color: var(--accent); }
        .input-area { height: 120px; resize: none; font-family: monospace; }
        .btn-submit { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        .btn-delete { position: absolute; top: 15px; right: 15px; background: rgba(0, 0, 0, 0.5); color: #ef4444; border: 1px solid #ef4444; border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; cursor: pointer; opacity: 0; transition: 0.2s; z-index: 10; }
        .card:hover .btn-delete { opacity: 1; }
        .btn-delete:hover { background: #ef4444; color: white; }

        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #333; color: var(--text-sub); font-size: 0.85rem; }
        .likes-count { font-weight: bold; color: #e4e4e7; display: flex; align-items: center; gap: 5px; }
        
        #loader { text-align: center; color: var(--text-sub); margin-bottom: 20px; display: none; }
        /* 🔥 상세 보기 글씨 크기 확대 (새로 추가하세요) */
        #v-content {
            font-size: 1.2rem;   /* 👈 글씨 크기 (기본 0.85rem -> 1.2rem 대폭 확대) */
            line-height: 1.8;    /* 👈 줄 간격 넓게 */
            min-height: 400px;   /* 👈 높이도 길게 확보 */
            background-color: #0d0d0d; /* 배경 더 어둡게 해서 가독성 UP */
        }
        
        #v-title { font-size: 2.2rem; } /* 제목도 키우기 */
        #v-desc { font-size: 1.1rem; }  /* 설명도 키우기 */
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="back-nav"><i class="fas fa-chevron-left"></i> 호들갑 LAB</a>
        <h1>Gemini 3 Prompt Lab</h1>
        <p>Advanced Prompt Engineering Archive for Next-Gen AI</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 키워드 검색 (예: 코딩, 번역, 논리...)">
        <button class="filter-btn active" onclick="filterData('ALL')">All</button>
        <button class="filter-btn" onclick="filterData('CODING')">Coding</button>
        <button class="filter-btn" onclick="filterData('WRITING')">Writing</button>
        <button class="filter-btn" onclick="filterData('LOGIC')">Logic</button>
    </div>

    <div id="loader"><i class="fas fa-spinner fa-spin"></i> Loading Database...</div>
    <div class="grid" id="promptGrid"></div>

    <button class="fab" onclick="openUploadModal()" title="새 프롬프트 등록">
        <i class="fas fa-plus"></i>
    </button>

    <div id="uploadModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box">
            <i class="fas fa-times close-icon" onclick="document.getElementById('uploadModal').style.display='none'"></i>
            <h2 style="margin-top:0; color:white;">✨ New Prompt</h2>
            <div class="input-group">
                <label>제목 (Title)</label>
                <input type="text" id="in-title" class="input-field" placeholder="예: 시니어 개발자 페르소나">
            </div>
            <div class="input-group">
                <label>설명 (Description)</label>
                <input type="text" id="in-desc" class="input-field" placeholder="간단한 설명을 적어주세요.">
            </div>
            <div class="input-group">
                <label>태그 (Category)</label>
                <select id="in-tag" class="input-field">
                    <option value="CODING">CODING</option>
                    <option value="WRITING">WRITING</option>
                    <option value="LOGIC">LOGIC</option>
                    <option value="IMAGE">IMAGE</option>
                </select>
            </div>
            <div class="input-group">
                <label>프롬프트 내용 (Content)</label>
                <textarea id="in-content" class="input-field input-area" placeholder="AI에게 입력할 명령어를 적어주세요."></textarea>
            </div>
            <button class="btn-submit" onclick="uploadPrompt()">업로드 (Upload)</button>
        </div>
    </div>

    <div id="viewModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box">
            <i class="fas fa-times close-icon" onclick="document.getElementById('viewModal').style.display='none'"></i>
            <span id="v-tag" class="tag">TAG</span>
            <h2 id="v-title" style="margin: 10px 0; color:white;">Title</h2>
            <p id="v-desc" style="color:#aaa; line-height:1.6;">Description</p>
            <div class="prompt-box" id="v-content" style="height:auto; max-height:300px;">Prompt Content...</div>
            <button class="copy-btn" style="margin-top:15px;">
                <i class="fas fa-copy"></i> Copy Prompt
            </button>
        </div>
    </div>

    <script>
        // ✅ DB 설정
        const supabaseUrl = 'https://sqbxawmpzknseksnicne.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxYnhhd21wemtuc2Vrc25pY25lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3Nzg0NjQsImV4cCI6MjA4NDM1NDQ2NH0.NsRS31_yv-eHbrpu4_dSo-xcC3zXl6NTIH3OiZrJz6U'; 

        const { createClient } = supabase;
        const _supabase = createClient(supabaseUrl, supabaseKey);

        let allPrompts = [];

        // 1. 데이터 불러오기
        async function loadPrompts() {
            const grid = document.getElementById('promptGrid');
            const loader = document.getElementById('loader');
            loader.style.display = 'block';
            grid.innerHTML = '';

            try {
                let { data, error } = await _supabase
                    .from('prompts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allPrompts = data;
                renderCards(allPrompts);
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<p style="text-align:center; color:#666; width:100%;">데이터 로딩 실패</p>';
            } finally {
                loader.style.display = 'none';
            }
        }

        // 2. 카드 렌더링 (좋아요 버튼 활성화!)
        function renderCards(data) {
            const grid = document.getElementById('promptGrid');
            grid.innerHTML = '';

            if(!data || data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color:#666; width:100%;">등록된 프롬프트가 없습니다.</p>';
                return;
            }

            data.forEach((item, index) => {
                let tagClass = 'tag-coding';
                if (item.tag === 'WRITING') tagClass = 'tag-writing';
                if (item.tag === 'LOGIC') tagClass = 'tag-logic';
                if (item.tag === 'IMAGE') tagClass = 'tag-image';

                const date = new Date(item.created_at).toLocaleDateString();

                // 🔥 내 브라우저에서 이미 좋아요 눌렀는지 확인
                const isLiked = localStorage.getItem(`liked_${item.id}`);
                const heartColor = isLiked ? '#ef4444' : '#666'; // 눌렀으면 빨강, 아니면 회색
                const heartIcon = isLiked ? 'fas fa-heart' : 'far fa-heart'; // 꽉 찬 하트 vs 빈 하트

                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <button class="btn-delete" onclick="deletePrompt(${item.id}, event)" title="관리자 삭제">
                        <i class="fas fa-trash"></i>
                    </button>
                    
                    <div onclick="openViewModal(${index})">
                        <span class="tag ${tagClass}">${item.tag}</span>
                        <h3>${item.title}</h3>
                        <p>${item.description}</p>
                        <div class="prompt-box">${item.content}</div>
                        
                        <div class="card-footer">
                            <span><i class="far fa-clock"></i> ${date}</span>
                            
                            <span class="likes-count" onclick="toggleLike(${item.id}, ${index}, event)" style="cursor:pointer; transition:0.2s; color:${heartColor};">
                                <i class="${heartIcon}"></i> ${item.likes}
                            </span>
                        </div>
                    </div>

                    <button class="copy-btn" onclick="copyPromptByIndex(${index}, this)">
                        <i class="fas fa-copy"></i> Copy Prompt
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // 🔥 [NEW] 좋아요 기능 (실시간 DB 반영 + 중복 방지)
        async function toggleLike(id, index, event) {
            event.stopPropagation(); // 카드 클릭(상세보기) 방지

            // 1. 이미 눌렀는지 체크 (localStorage 사용)
            if (localStorage.getItem(`liked_${id}`)) {
                return alert("이미 좋아요를 누르셨습니다! ❤️");
            }

            // 2. 화면에서 먼저 숫자 올려주기 (빠른 반응 속도)
            allPrompts[index].likes += 1;
            renderCards(allPrompts); // 화면 갱신 (빨간 하트로 변함)

            // 3. 진짜 DB에 +1 저장하기
            try {
                const { error } = await _supabase
                    .from('prompts')
                    .update({ likes: allPrompts[index].likes })
                    .eq('id', id);

                if (error) throw error;
                
                // 4. "나 이거 눌렀음" 기록 남기기
                localStorage.setItem(`liked_${id}`, "true");

            } catch (err) {
                console.error("좋아요 실패:", err);
                alert("오류가 발생했습니다.");
                // 에러나면 숫자 다시 내림
                allPrompts[index].likes -= 1;
                renderCards(allPrompts);
            }
        }

        // 기존 기능들 (복사, 삭제, 업로드 등) ---
        function copyPromptByIndex(index, btn) {
            const data = allPrompts[index];
            navigator.clipboard.writeText(data.content).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                btn.style.background = '#8b5cf6';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            });
        }

        async function deletePrompt(id, event) {
            event.stopPropagation();
            const password = prompt("관리자 비밀번호를 입력하세요:");
            if (password !== "1234") return alert("비밀번호 오류!"); 
            if (!confirm("정말 삭제하시겠습니까?")) return;

            try {
                const { error } = await _supabase.from('prompts').delete().eq('id', id);
                if (error) throw error;
                alert("삭제되었습니다.");
                loadPrompts();
            } catch (err) {
                alert("삭제 실패: " + err.message);
            }
        }

        async function uploadPrompt() {
            const title = document.getElementById('in-title').value;
            const desc = document.getElementById('in-desc').value;
            const tag = document.getElementById('in-tag').value;
            const content = document.getElementById('in-content').value;

            if (!title || !content) return alert('내용을 입력하세요!');
            const btn = document.querySelector('.btn-submit');
            btn.innerText = "저장 중...";

            try {
                const { error } = await _supabase
                    .from('prompts')
                    .insert([{ title, description: desc, tag, content }]);
                if (error) throw error;
                alert('업로드 성공!');
                document.getElementById('uploadModal').style.display = 'none';
                document.getElementById('in-title').value = '';
                document.getElementById('in-desc').value = '';
                document.getElementById('in-content').value = '';
                loadPrompts();
            } catch (err) {
                alert('에러: ' + err.message);
            } finally {
                btn.innerText = "업로드 (Upload)";
            }
        }

        function filterData(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if (category === 'ALL') renderCards(allPrompts);
            else renderCards(allPrompts.filter(p => p.tag === category));
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allPrompts.filter(p => 
                p.title.toLowerCase().includes(keyword) || 
                p.description.toLowerCase().includes(keyword) ||
                p.tag.toLowerCase().includes(keyword)
            );
            renderCards(filtered);
        });

        function openViewModal(index) {
            const data = allPrompts[index];
            const modal = document.getElementById('viewModal');
            document.getElementById('v-title').innerText = data.title;
            
            let tagClass = 'tag-coding';
            if (data.tag === 'WRITING') tagClass = 'tag-writing';
            if (data.tag === 'LOGIC') tagClass = 'tag-logic';
            if (data.tag === 'IMAGE') tagClass = 'tag-image';
            
            const tagEl = document.getElementById('v-tag');
            tagEl.innerText = data.tag;
            tagEl.className = `tag ${tagClass}`;
            
            document.getElementById('v-desc').innerText = data.description;
            document.getElementById('v-content').innerText = data.content;
            
            const modalCopyBtn = modal.querySelector('.copy-btn');
            modalCopyBtn.onclick = function() { copyPromptByIndex(index, this); };

            modal.style.display = 'flex';
        }

        function openUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal(e) { if(e.target.id === 'uploadModal' || e.target.id === 'viewModal') e.target.style.display = 'none'; }
        
        loadPrompts();
    </script>
</body>
</html>
