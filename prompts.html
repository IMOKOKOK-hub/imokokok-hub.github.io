<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 3 Prompt Lab</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #18181b;
            --border: #27272a;
            --text-main: #e4e4e7;
            --text-sub: #a1a1aa;
            --accent: #8b5cf6; /* 제미나이 보라색 느낌 */
            --accent-glow: rgba(139, 92, 246, 0.3);
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 1. 헤더 섹션 */
        .header {
            text-align: center;
            padding: 80px 20px;
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 70%);
        }
        .header h1 {
            font-size: 3.5rem;
            margin: 0;
            background: linear-gradient(to right, #c4b5fd, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .header p { color: var(--text-sub); font-size: 1.2rem; margin-top: 10px; max-width: 600px; margin-left: auto; margin-right: auto; }

        /* 2. 검색 & 필터 */
        .controls {
            max-width: 1000px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .search-bar {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        
        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* 3. 프롬프트 카드 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }
        /* 태그 색상들 */
        .tag-coding { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .tag-writing { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .tag-logic { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        .card h3 { margin: 0 0 10px 0; font-size: 1.3rem; }
        .card p { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; flex-grow: 1; }

        /* 프롬프트 내용 박스 */
        .prompt-box {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            color: #d4d4d8;
            height: 100px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid #333;
            white-space: pre-wrap; /* 줄바꿈 유지 */
        }
        /* 스크롤바 디자인 */
        .prompt-box::-webkit-scrollbar { width: 6px; }
        .prompt-box::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* 복사 버튼 */
        .copy-btn {
            background: var(--text-main);
            color: black;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .copy-btn:hover { background: var(--accent); color: white; }
        .copy-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <header class="header">
        <h1>Gemini 3 Prompt Lab</h1>
        <p>Advanced Prompt Engineering Archive for Next-Gen AI</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 키워드 검색 (예: 코딩, 번역, 논리...)">
        <button class="filter-btn active" onclick="filterPrompts('all')">All</button>
        <button class="filter-btn" onclick="filterPrompts('coding')">Coding</button>
        <button class="filter-btn" onclick="filterPrompts('writing')">Writing</button>
        <button class="filter-btn" onclick="filterPrompts('logic')">Logic</button>
    </div>

    <div class="grid" id="promptGrid">
        </div>

    <script>
        // ✅ 여기에 프롬프트 데이터를 계속 추가하면 됩니다!
        const prompts = [
            {
                title: "시니어 파이썬 개발자 모드",
                desc: "스파게티 코드를 완벽한 클린 코드와 주석으로 리팩토링해줍니다.",
                tag: "coding",
                content: "You are a Senior Python Developer at Google. Review the following code. Optimize it for time complexity O(n), add docstrings following PEP-8 standards, and explain your refactoring logic step-by-step.\n\n[Code to review]:\n"
            },
            {
                title: "제미나이 3.0 스토리텔러",
                desc: "단어 몇 개만 던져주면 소름 돋는 SF 단편 소설을 써줍니다.",
                tag: "writing",
                content: "Act as an award-winning Sci-Fi novelist. Write a short story based on the keywords provided below. The tone should be dark, mysterious, and philosophical like 'Black Mirror'. Include a shocking plot twist at the end.\n\nKeywords: "
            },
            {
                title: "복잡한 개념 5세 설명",
                desc: "양자역학, 블록체인 같은 어려운 개념을 유치원생도 이해하게 설명합니다.",
                tag: "logic",
                content: "Explain the following complex topic to a 5-year-old using simple analogies (like toys, animals, or playground games). Avoid jargon completely.\n\nTopic: "
            },
            {
                title: "유튜브 썸네일/제목 어그로",
                desc: "조회수 폭발하는 유튜브 제목과 썸네일 아이디어를 5개씩 뽑아줍니다.",
                tag: "writing",
                content: "You represent a viral YouTube marketing agency. Generate 5 click-bait titles and 5 engaging thumbnail concepts for a video about the following topic. Maximize CTR (Click Through Rate).\n\nVideo Topic: "
            },
            {
                title: "SQL 쿼리 마법사",
                desc: "말로 대충 설명하면 복잡한 Join이 포함된 SQL 쿼리를 짜줍니다.",
                tag: "coding",
                content: "Act as a Database Administrator. Convert the following natural language request into a highly optimized SQL query (PostgreSQL). Explain any indexes required for performance.\n\nRequest: "
            },
            {
                title: "논리적 오류 탐지기",
                desc: "상대방의 주장이나 글에서 논리적 허점을 찾아 반박합니다.",
                tag: "logic",
                content: "Analyze the argument below for logical fallacies (e.g., straw man, ad hominem). Identify the weak points and provide a counter-argument based on facts and logic.\n\nArgument: "
            }
        ];

        const grid = document.getElementById('promptGrid');
        const searchInput = document.getElementById('searchInput');

        // 초기 렌더링
        renderCards(prompts);

        // 카드 생성 함수
        function renderCards(data) {
            grid.innerHTML = '';
            data.forEach(item => {
                // 태그 색상 결정
                let tagClass = 'tag-coding';
                if (item.tag === 'writing') tagClass = 'tag-writing';
                if (item.tag === 'logic') tagClass = 'tag-logic';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="tag ${tagClass}">${item.tag.toUpperCase()}</span>
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p>
                    <div class="prompt-box">${item.content}</div>
                    <button class="copy-btn" onclick="copyText(this, \`${item.content.replace(/`/g, "\\`")}\`)">
                        <i class="fas fa-copy"></i> Copy Prompt
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // 복사 기능
        function copyText(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                btn.style.background = '#8b5cf6';
                btn.style.color = '#fff';
                
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.style.background = '';
                    btn.style.color = '';
                }, 2000);
            });
        }

        // 검색 기능
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = prompts.filter(p => 
                p.title.toLowerCase().includes(keyword) || 
                p.desc.toLowerCase().includes(keyword) ||
                p.tag.toLowerCase().includes(keyword)
            );
            renderCards(filtered);
        });

        // 필터 버튼 기능
        function filterPrompts(category) {
            // 버튼 활성화 스타일 변경
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderCards(prompts);
            } else {
                const filtered = prompts.filter(p => p.tag === category);
                renderCards(filtered);
            }
        }
    </script>
</body>
</html>
