name: AdSense Blog Ranker

on:
  schedule:
    - cron: '0 15 * * *' # 한국 시간 매일 자정 (UTC 15:00)
  workflow_dispatch: # 우리가 지금 바로 눌러서 테스트해볼 수 있게 함

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run Analysis
        env:
          MY_API_KEY: ${{ secrets.MY_API_KEY }}
        run: python update_rank.py
      - name: Save Results
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data.json
          git commit -m "Update Daily Blog Rankings" || exit 0
          git push
