<table>
    <thead>
        <tr>
            <th>순위</th>
            <th>블로그 주소</th>
            <th>SEO</th>
            <th>속도(성능)</th>
            <th>접근성</th>
            <th>표준준수</th>
        </tr>
    </thead>
    <tbody id="table-body"></tbody>
</table>

<script>
    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            const body = document.getElementById('table-body');
            // SEO 점수 기준으로 일단 정렬
            data.sort((a, b) => b.seo - a.seo); 
            data.forEach((item, index) => {
                const row = `<tr>
                    <td>${index + 1}</td>
                    <td>${item.url}</td>
                    <td class="score">${item.seo}</td>
                    <td class="score">${item.performance}</td>
                    <td class="score">${item.accessibility}</td>
                    <td class="score">${item.best_practices}</td>
                </tr>`;
                body.innerHTML += row;
            });
        });
</script>
