<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOG INSIGHT PRO V5</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111318; --card: #1e2129; --text-main: #ffffff; --text-sub: #9ca3af;
            --accent: #6366f1; --success: #10b981; --warn: #f59e0b; --danger: #ef4444; --border: #2d313a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text-main); font-family: 'Pretendard', sans-serif; padding: 20px; min-height: 100vh; }
        
        .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* 헤더 */
        .header { display: flex; gap: 10px; background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
        .logo { font-size: 20px; font-weight: 900; margin-right: auto; }
        .logo span { color: var(--accent); }
        .search-box { display: flex; gap: 10px; flex: 1; max-width: 600px; }
        input { flex: 1; background: #000; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; outline: none; }
        button { background: var(--accent); color: white; border: none; padding: 0 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { filter: brightness(1.1); }

        /* 메인 그리드 */
        .main-grid { display: grid; grid-template-columns: 300px 1fr 350px; gap: 15px; }
        @media (max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }

        /* 카드 공통 */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; overflow: hidden; display: flex; flex-direction: column; }
        .card-title { font-size: 14px; color: var(--text-sub); margin-bottom: 15px; font-weight: bold; display: flex; justify-content: space-between; }

        /* 1. 등급 패널 */
        .grade-box { text-align: center; padding: 20px 0; }
        .grade-val { font-size: 80px; font-weight: 900; line-height: 1; text-shadow: 0 0 30px rgba(99, 102, 241, 0.3); }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .m-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; text-align: center; }
        .m-lbl { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 4px; }
        .m-val { font-size: 16px; font-weight: bold; }

        /* 2. 차트 패널 */
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; height: 300px; }
        .chart-con { flex: 1; position: relative; }

        /* 3. 로그 패널 (디버깅 핵심) */
        .log-panel { background: #000; font-family: 'Consolas', monospace; font-size: 12px; max-height: 500px; }
        .logs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 5px; }
        .log-line { line-height: 1.4; border-bottom: 1px dashed #222; padding-bottom: 2px; }
        .tm { color: #555; margin-right: 5px; }
        .inf { color: #ddd; }
        .wrn { color: var(--warn); }
        .err { color: var(--danger); font-weight: bold; }
        .suc { color: var(--success); }

        /* 하단 테이블 */
        .table-wrap { grid-column: 1 / -1; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 12px; background: #252a33; color: var(--text-sub); }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        .bad-tag { color: var(--danger); background: rgba(239, 68, 68, 0.1); padding: 2px 6px; border-radius: 4px; font-size: 11px; }

        /* 로딩 */
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; display: none; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p style="margin-top:15px; font-weight:bold;">SYSTEM ANALYZING...</p></div>

<div class="container">
    <div class="header">
        <div class="logo"><i class="fa-solid fa-chart-simple" style="color:var(--accent)"></i> BLOG<span>INSIGHT</span> V5</div>
        <div class="search-box">
            <input type="text" id="targetUrl" value="https://mkkrw.tistory.com" placeholder="URL 입력">
            <button onclick="startAnalysis()">진단 시작</button>
        </div>
    </div>

    <div class="main-grid">
        <div class="card">
            <div class="card-title">TOTAL SCORE</div>
            <div class="grade-box">
                <div class="grade-val" id="totalGrade">-</div>
                <div style="color:var(--text-sub); margin-top:5px;" id="totalScore">READY</div>
            </div>
            <div class="metrics">
                <div class="m-item"><span class="m-lbl">로딩(LCP)</span><span class="m-val" id="v-lcp">-</span></div>
                <div class="m-item"><span class="m-lbl">반응(TBT)</span><span class="m-val" id="v-tbt">-</span></div>
                <div class="m-item"><span class="m-lbl">안정(CLS)</span><span class="m-val" id="v-cls">-</span></div>
                <div class="m-item"><span class="m-lbl">용량(WGT)</span><span class="m-val" id="v-wgt">-</span></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">BALANCE & RESOURCES</div>
            <div class="charts">
                <div class="chart-con"><canvas id="radarChart"></canvas></div>
                <div class="chart-con"><canvas id="doughnutChart"></canvas></div>
            </div>
        </div>

        <div class="card log-panel">
            <div class="card-title" style="color:var(--accent)">> SYSTEM LOG</div>
            <div class="logs" id="logBox">
                <div class="log-line"><span class="tm">INIT</span><span class="inf">System Ready.</span></div>
            </div>
        </div>
    </div>

    <div class="card table-wrap">
        <div class="card-title">🚀 개선 기회 (TOP OPPORTUNITIES)</div>
        <table>
            <thead><tr><th>진단 항목</th><th>절약 가능</th><th>상태</th></tr></thead>
            <tbody id="oppTable"><tr><td colspan="3" style="text-align:center; padding:30px; color:#555;">분석 대기 중...</td></tr></tbody>
        </table>
    </div>
</div>

<script>
    // ★ 성준님의 구글 API 키 (여기 입력)
    const API_KEY = "AIzaSyD8yjouvSUcS0MNPwhos9B3JRDn2hnrRgA";

    // 로거 함수
    function log(msg, type='inf') {
        const box = document.getElementById('logBox');
        const time = new Date().toLocaleTimeString('en-US', {hour12:false});
        box.innerHTML += `<div class="log-line"><span class="tm">[${time}]</span><span class="${type}">${msg}</span></div>`;
        box.scrollTop = box.scrollHeight;
    }

    async function startAnalysis() {
        const url = document.getElementById('targetUrl').value;
        if(!url) return alert("URL을 입력하세요");

        document.getElementById('loading').style.display = 'flex';
        document.getElementById('logBox').innerHTML = ''; // 로그 초기화
        
        log(`Target: ${url}`, 'inf');
        log('Connecting to Google PageSpeed API...', 'warn');

        try {
            const api = `https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${url}&category=seo&category=performance&category=accessibility&key=${API_KEY}`;
            const res = await fetch(api);
            const data = await res.json();

            // ★ 에러 처리 (여기가 핵심!)
            if(data.error) {
                log(`API Error Code: ${data.error.code}`, 'err');
                log(`Message: ${data.error.message}`, 'err');
                
                if(data.error.code === 403) {
                    log("👉 [해결법] 구글 클라우드 콘솔에서 API 키의 '웹사이트 제한' 설정을 확인하세요.", 'inf');
                    log("👉 'https://imokokok-hub.github.io/*' 주소가 정확한지 체크하세요.", 'inf');
                }
                throw new Error("API 요청 거부됨");
            }

            log('데이터 수신 성공! 분석 시작...', 'suc');
            renderAll(data.lighthouseResult);

        } catch(e) {
            log(`System Halted: ${e.message}`, 'err');
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    function renderAll(res) {
        const audits = res.audits;
        
        // 1. 데이터 추출
        const lcp = audits['largest-contentful-paint'].numericValue;
        const tbt = audits['total-blocking-time'].numericValue;
        const cls = audits['cumulative-layout-shift'].numericValue;
        const bytes = audits['total-byte-weight'].numericValue;
        
        // 2. 점수 및 등급
        const score = res.categories.performance.score * 100;
        const grade = score >= 90 ? 'S' : score >= 80 ? 'A' : score >= 60 ? 'B' : 'F';
        const color = score >= 90 ? '#a855f7' : score >= 80 ? '#10b981' : score >= 60 ? '#f59e0b' : '#ef4444';

        document.getElementById('totalGrade').innerText = grade;
        document.getElementById('totalGrade').style.color = color;
        document.getElementById('totalScore').innerText = `${Math.round(score)} / 100`;

        // 3. 지표 업데이트
        document.getElementById('v-lcp').innerText = (lcp/1000).toFixed(2) + 's';
        document.getElementById('v-tbt').innerText = Math.round(tbt) + 'ms';
        document.getElementById('v-cls').innerText = cls.toFixed(3);
        document.getElementById('v-wgt').innerText = (bytes/1024/1024).toFixed(1) + 'MB';

        // 4. 로그 코멘트
        if(bytes > 3000000) log(`[데이터] 페이지 용량 과다 (${(bytes/1024/1024).toFixed(1)}MB).`, 'err');
        else log(`[데이터] 페이지 용량 양호.`, 'suc');
        
        const heavyImg = audits['total-byte-weight'].details.items.filter(i => i.totalBytes > 500000).length;
        if(heavyImg > 0) log(`[이미지] 500KB 이상 고용량 이미지 ${heavyImg}개 발견.`, 'warn');

        // 5. 차트 및 테이블 렌더링
        drawCharts(res);
        drawTable(audits);
        
        log('분석 완료. 리포트 생성됨.', 'suc');
    }

    function drawTable(audits) {
        const tbody = document.getElementById('oppTable');
        tbody.innerHTML = '';
        
        const opps = [
            audits['unused-javascript'],
            audits['unused-css-rules'],
            audits['offscreen-images'],
            audits['render-blocking-resources'],
            audits['modern-image-formats']
        ].filter(i => i && i.score < 1);

        if(opps.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px; color:var(--success)">🎉 완벽합니다! 개선할 항목이 없습니다.</td></tr>';
            return;
        }

        opps.forEach(op => {
            const save = op.wastedMs ? `${Math.round(op.wastedMs)}ms 단축` : `${(op.overallSavingsBytes/1024).toFixed(0)}KB 절약`;
            tbody.innerHTML += `<tr>
                <td>${op.title}<div style="font-size:12px; color:#666;">${op.description.substring(0,50)}...</div></td>
                <td style="color:var(--danger); font-weight:bold;">${save}</td>
                <td><span class="bad-tag">확인필요</span></td>
            </tr>`;
        });
    }

    // 차트 (Radar & Doughnut)
    let radarC, doughC;
    function drawCharts(res) {
        const ctxR = document.getElementById('radarChart');
        const ctxD = document.getElementById('doughnutChart');
        if(radarC) radarC.destroy();
        if(doughC) doughC.destroy();

        // 레이더
        const scores = [
            res.categories.performance.score * 100,
            res.categories.accessibility.score * 100,
            res.categories['best-practices'].score * 100,
            res.categories.seo.score * 100,
            Math.min(100, (res.audits['interactive'].score * 100))
        ];
        radarC = new Chart(ctxR, {
            type: 'radar',
            data: {
                labels: ['성능', '접근성', '모범', 'SEO', '상호작용'],
                datasets: [{ label: '점수', data: scores, backgroundColor: 'rgba(99, 102, 241, 0.2)', borderColor: '#6366f1', borderWidth: 2 }]
            },
            options: { scales: { r: { min: 0, max: 100, grid: {color:'#333'}, pointLabels:{color:'#aaa', font:{size:10}} } }, plugins: { legend: {display:false} } }
        });

        // 도넛
        const items = res.audits['resource-summary'].details.items.filter(i => i.resourceType !== 'total' && i.transferSize > 0);
        doughC = new Chart(ctxD, {
            type: 'doughnut',
            data: {
                labels: items.map(i => i.label),
                datasets: [{ data: items.map(i => i.transferSize), backgroundColor: ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'], borderWidth: 0 }]
            },
            options: { plugins: { legend: {display:false} }, cutout: '70%' }
        });
    }
</script>
</body>
</html>
