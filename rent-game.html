<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Rent Guesser</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }
        h1 { margin-bottom: 5px; color: #ffd700; font-size: 1.8rem; }
        .subtitle { color: #aaaaaa; margin-bottom: 20px; font-size: 0.9rem; }
        
        .score-board { 
            font-size: 1.2rem; 
            margin-bottom: 15px; 
            background: #2c2c2c;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* 이미지 카드 스타일 */
        .card {
            background: #1e1e1e;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .room-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }
        
        .location-badge {
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* 버튼 그리드 */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            background: #333;
            border: 1px solid #444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background: #444; }
        button:active { transform: scale(0.95); }

        /* 정답/오답 스타일 */
        .correct { background: #00b894 !important; border-color: #00b894 !important; color: black !important; }
        .wrong { background: #d63031 !important; border-color: #d63031 !important; }

        .result-area {
            min-height: 50px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .result-text { font-size: 1.1rem; margin-bottom: 10px; }
        
        #next-btn {
            background: #ffd700;
            color: black;
            width: 100%;
            border: none;
            display: none;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="ui-title"></h1>
        <div class="subtitle" id="ui-subtitle"></div>
        <div class="score-board"><span id="ui-score"></span>: <span id="score-val">0</span></div>

        <div class="card">
            <img id="room-image" class="room-img" src="" alt="Room Image">
            <div class="location-badge">
                📍 <span id="location-text"></span>
            </div>
            
            <div id="options-container" class="options">
                </div>
        </div>

        <div class="result-area">
            <div id="result-message" class="result-text"></div>
            <button id="next-btn" onclick="nextProblem()"></button>
        </div>
    </div>

    <script>
        // 1. 언어 설정 (한국어 아니면 무조건 영어)
        const userLang = navigator.language.startsWith('ko') ? 'ko' : 'en';

        // 2. 번역 데이터 (여기만 고치면 언어 내용 바뀜)
        const uiText = {
            ko: {
                title: "💰 월세 맞히기",
                subtitle: "이 방의 한 달 월세는 얼마일까요? (USD 기준)",
                score: "점수",
                next: "다음 문제 ➡",
                correct: "✅ 정답!",
                wrong: "❌ 땡! 정답은: ",
                currency: "달러"
            },
            en: {
                title: "💰 Guess the Rent",
                subtitle: "How much is the monthly rent? (in USD)",
                score: "Score",
                next: "Next Level ➡",
                correct: "✅ Correct!",
                wrong: "❌ Wrong! Answer: ",
                currency: "$"
            }
        };

        // 3. 문제 데이터 (한국어/영어 설명 포함)
        const problems = [
            {
                loc: { ko: "미국, 뉴욕 맨해튼", en: "NYC, Manhattan, USA" },
                img: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=600&q=80", 
                price: 3800,
                options: [2200, 3800, 5500, 1500]
            },
            {
                loc: { ko: "베트남, 호치민", en: "Ho Chi Minh, Vietnam" },
                img: "https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600&q=80",
                price: 600,
                options: [600, 1200, 2500, 300]
            },
            {
                loc: { ko: "대한민국, 서울 강남", en: "Seoul, Gangnam, Korea" },
                img: "https://images.unsplash.com/photo-1493809842364-78817add7ffb?w=600&q=80",
                price: 1000,
                options: [600, 1000, 1500, 2000]
            },
            {
                loc: { ko: "프랑스, 파리", en: "Paris, France" },
                img: "https://images.unsplash.com/photo-1505691938895-1758d7feb511?w=600&q=80",
                price: 1200,
                options: [800, 1200, 1800, 2500]
            },
            {
                loc: { ko: "인도네시아, 발리", en: "Bali, Indonesia" },
                img: "https://images.unsplash.com/photo-1570211776045-af3a51026f4a?w=600&q=80",
                price: 800,
                options: [400, 800, 2000, 3500]
            }
        ];

        let currentProblem = {};
        let score = 0;
        let isAnswered = false;

        // UI 텍스트 적용 함수
        function applyLanguage() {
            const t = uiText[userLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-subtitle').innerText = t.subtitle;
            document.getElementById('ui-score').innerText = t.score;
            document.getElementById('next-btn').innerText = t.next;
        }

        function initGame() {
            applyLanguage(); // 언어 적용
            nextProblem();
        }

        function nextProblem() {
            isAnswered = false;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('result-message').innerText = '';
            
            // 랜덤 문제 뽑기
            const randomIndex = Math.floor(Math.random() * problems.length);
            currentProblem = problems[randomIndex];

            // 이미지 & 지역명(언어에 맞게) 표시
            document.getElementById('room-image').src = currentProblem.img;
            document.getElementById('location-text').innerText = currentProblem.loc[userLang];

            // 보기 버튼 생성
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; 

            let shuffledOptions = [...currentProblem.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = `$${opt}`;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedPrice, btnElement) {
            if (isAnswered) return;
            isAnswered = true;
            const t = uiText[userLang];
            const correctPrice = currentProblem.price;
            
            if (selectedPrice === correctPrice) {
                btnElement.classList.add('correct');
                document.getElementById('result-message').innerText = t.correct;
                score += 100;
                document.getElementById('score-val').innerText = score;
            } else {
                btnElement.classList.add('wrong');
                document.getElementById('result-message').innerText = `${t.wrong} $${correctPrice}`;
                
                // 정답 버튼 표시
                const buttons = document.querySelectorAll('.options button');
                buttons.forEach(b => {
                    if (parseInt(b.innerText.replace('$','')) === correctPrice) {
                        b.classList.add('correct');
                    }
                });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        // 실행
        initGame();
    </script>
</body>
</html>
