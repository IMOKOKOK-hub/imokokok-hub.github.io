<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Dog Guesser</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #2d3436;
            color: #dfe6e9;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { color: #ffeaa7; margin-bottom: 5px; font-size: 2rem; }
        p { color: #b2bec3; margin-bottom: 20px; }

        /* 이미지 카드 */
        .card {
            background: #fff;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        
        .dog-img {
            width: 100%;
            height: 350px;
            object-fit: contain; /* 사진 비율 유지 */
            border-radius: 10px;
            background-color: #eee;
        }

        /* 버튼들 */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
        }

        button {
            background: #636e72;
            border: none;
            color: white;
            padding: 15px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            text-transform: capitalize; /* 첫 글자 대문자 */
        }
        button:hover { background: #b2bec3; color: #2d3436; }
        button:active { transform: scale(0.98); }

        .correct { background: #00b894 !important; color: white !important; }
        .wrong { background: #d63031 !important; color: white !important; }

        #result-msg {
            margin-top: 20px;
            height: 30px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        #next-btn {
            background: #ffeaa7;
            color: #2d3436;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>🐶 Dog Breed Guesser</h1>
    <p>What is the breed of this dog?</p>

    <div class="card">
        <img id="dog-image" class="dog-img" src="" alt="Loading dog...">
        
        <div id="options-container" class="options">
            </div>

        <div id="result-msg"></div>
        <button id="next-btn" onclick="nextRound()">Next Dog ➡</button>
    </div>

    <script>
        // ✅ 100% 무료 Dog API 사용
        const API_URL = "https://dog.ceo/api/breeds/image/random";
        const ALL_BREEDS_URL = "https://dog.ceo/api/breeds/list/all";

        let correctBreed = "";
        let allBreeds = []; // 모든 견종 리스트 저장

        // 게임 시작 전, 모든 견종 리스트를 한 번 가져옴
        async function fetchBreedsList() {
            try {
                const response = await fetch(ALL_BREEDS_URL);
                const data = await response.json();
                allBreeds = Object.keys(data.message); // 견종 이름만 추출
                nextRound(); // 리스트 다 가져오면 게임 시작
            } catch (error) {
                alert("API Error! Please refresh.");
            }
        }

        async function nextRound() {
            // 초기화
            document.getElementById('result-msg').innerText = '';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('dog-image').src = ""; // 이미지 깜빡임 방지
            const optionsDiv = document.getElementById('options-container');
            optionsDiv.innerHTML = '<div style="grid-column:span 2; text-align:center; color:#333;">Fetching random dog...</div>';

            try {
                // 1. 랜덤 강아지 사진 가져오기
                const res = await fetch(API_URL);
                const data = await res.json();
                const imgUrl = data.message;

                // 2. URL에서 정답(견종) 추출 (예: .../breeds/beagle/...)
                // URL 구조: https://images.dog.ceo/breeds/beagle/n02088364_123.jpg
                const splitUrl = imgUrl.split('/');
                correctBreed = splitUrl[4]; // 'beagle' 부분 추출

                // 3. 이미지 화면에 표시
                document.getElementById('dog-image').src = imgUrl;

                // 4. 오답 보기 3개 만들기
                let options = [correctBreed];
                while (options.length < 4) {
                    const randomBreed = allBreeds[Math.floor(Math.random() * allBreeds.length)];
                    // 중복 아니면 추가, 서브 견종(spaniel-cocker 등)은 깔끔하게 정리
                    if (!options.includes(randomBreed)) {
                        options.push(randomBreed);
                    }
                }

                // 5. 보기 섞기
                options.sort(() => Math.random() - 0.5);

                // 6. 버튼 그리기
                optionsDiv.innerHTML = ''; // 로딩 텍스트 삭제
                options.forEach(breed => {
                    const btn = document.createElement('button');
                    // 이름 좀 예쁘게 (하이픈 제거)
                    btn.innerText = breed.replace('-', ' '); 
                    btn.onclick = () => checkAnswer(breed, btn);
                    optionsDiv.appendChild(btn);
                });

            } catch (err) {
                console.error(err);
            }
        }

        function checkAnswer(selected, btn) {
            // 정답 확인 로직
            const buttons = document.querySelectorAll('.options button');
            buttons.forEach(b => b.disabled = true); // 중복 클릭 방지

            if (selected === correctBreed) {
                btn.classList.add('correct');
                document.getElementById('result-msg').innerHTML = "✅ Correct! Good Boy!";
            } else {
                btn.classList.add('wrong');
                document.getElementById('result-msg').innerHTML = `❌ Oops! It's a <b>${correctBreed.replace('-', ' ')}</b>`;
                
                // 정답 버튼 초록색으로 보여주기
                buttons.forEach(b => {
                    if (b.innerText.toLowerCase() === correctBreed.replace('-', ' ')) {
                        b.classList.add('correct');
                    }
                });
            }
            document.getElementById('next-btn').style.display = 'block';
        }

        // 실행
        fetchBreedsList();

    </script>
</body>
</html>
