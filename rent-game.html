<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global CCTV Guesser</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        h1 { color: #ff0000; letter-spacing: 2px; text-transform: uppercase; }
        .live-badge { 
            background: red; color: white; padding: 2px 8px; 
            border-radius: 4px; font-size: 0.8rem; vertical-align: middle; 
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* 비디오 화면 스타일 */
        .video-frame {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 비율 유지 */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            border: 2px solid #333;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }
        .video-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 가림막 (정답 공개 전 힌트 방지용 - 선택사항) */
        .overlay {
            display: none; /* 지금은 끔 */
        }

        /* 버튼 */
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 20px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.2s;
        }
        button:hover { background: #333; border-color: #fff; }

        .correct { background: #00b894 !important; border-color: #00b894 !important; }
        .wrong { background: #d63031 !important; border-color: #d63031 !important; }

        #result-msg { margin-top: 20px; font-size: 1.5rem; font-weight: bold; min-height: 40px; }
        #next-btn { 
            background: #fff; color: #000; font-weight: bold; 
            display: none; margin-top: 20px; width: 100%; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><span class="live-badge">LIVE</span> City Guesser</h1>
        <p>Where is this live camera located?</p>
        
        <div class="video-frame">
            <div id="player"></div>
        </div>

        <div id="options-container" class="options"></div>
        
        <div id="result-msg"></div>
        <button id="next-btn" onclick="nextRound()">Next City ➡</button>
    </div>

    <script>
        // 1. 유튜브 API 로드
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        
        // 2. 데이터 (유튜브 영상 ID만 있으면 무한 확장 가능)
        // 영상이 짤리면 'videoId'만 다른 걸로 갈아끼우면 됨
        // 100% 작동하는 4K 산책 영상 리스트 (라이브보다 화질 좋고 안정적)
        const cams = [
            { 
                id: "F8MN0o6RS9o", // 뉴욕 맨해튼 4K 산책
                city: "New York, USA", 
                options: ["New York, USA", "Chicago, USA", "Toronto, Canada", "London, UK"] 
            },
            { 
                id: "Et7O5-teNzY", // 도쿄 시부야 비오는 날
                city: "Tokyo, Japan", 
                options: ["Seoul, Korea", "Tokyo, Japan", "Hong Kong", "Shanghai, China"] 
            },
            { 
                id: "Vo6s5A8mN0g", // 베니스 운하 투어
                city: "Venice, Italy", 
                options: ["Paris, France", "Venice, Italy", "Amsterdam, Netherlands", "Rome, Italy"] 
            },
            { 
                id: "7Nb-J_Y3mQk", // 서울 강남 밤거리
                city: "Seoul, Korea", 
                options: ["Busan, Korea", "Seoul, Korea", "Bangkok, Thailand", "Tokyo, Japan"] 
            },
            {
                id: "21MwTizKIBk", // 런던 2층 버스 투어
                city: "London, UK",
                options: ["London, UK", "Dublin, Ireland", "Berlin, Germany", "Melbourne, Australia"]
            },
            {
                id: "P2l0lbnQCAg", // 스위스 기차 풍경
                city: "Switzerland",
                options: ["Switzerland", "New Zealand", "Norway", "Canada"]
            }
        ];

        let currentRound = {};
        let isAnswered = false;

        function onYouTubeIframeAPIReady() {
            nextRound(); // API 준비되면 게임 시작
        }

        function nextRound() {
            isAnswered = false;
            document.getElementById('result-msg').innerText = '';
            document.getElementById('next-btn').style.display = 'none';

            // 랜덤 선택
            const randIdx = Math.floor(Math.random() * cams.length);
            currentRound = cams[randIdx];

            // 플레이어가 없으면 생성, 있으면 영상 로드
            if (!player) {
                player = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    videoId: currentRound.id,
                    playerVars: { 
                        'autoplay': 1, 
                        'mute': 1, // 자동재생을 위해 음소거 필수
                        'controls': 0, // 컨트롤바 숨김
                        'showinfo': 0 
                    },
                    events: {
                        'onReady': onPlayerReady
                    }
                });
            } else {
                player.loadVideoById(currentRound.id);
            }

            // 보기 버튼 생성
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            // 보기 섞기
            let shuffled = [...currentRound.options].sort(() => Math.random() - 0.5);

            shuffled.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function checkAnswer(selected, btn) {
            if (isAnswered) return;
            isAnswered = true;

            if (selected === currentRound.city) {
                btn.classList.add('correct');
                document.getElementById('result-msg').innerText = "✅ Correct! Welcome to " + currentRound.city.split(',')[0];
            } else {
                btn.classList.add('wrong');
                document.getElementById('result-msg').innerText = "❌ No! This is " + currentRound.city;
            }
            document.getElementById('next-btn').style.display = 'block';
        }
    </script>
</body>
</html>
