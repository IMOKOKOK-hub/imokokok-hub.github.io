<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bug Survivor: Roguelike v2.0</title>
    <style>
        /* 기본 스타일 */
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Courier New', monospace; touch-action: none; user-select: none; }
        canvas { display: block; }

        /* UI 오버레이 */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .bar-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 300px; height: 20px; background: #333; border-radius: 10px; border: 2px solid #555; overflow: hidden; }
        #xp-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #facc15, #eab308); transition: width 0.2s; }
        #score-board { position: absolute; top: 50px; width: 100%; text-align: center; color: white; font-weight: bold; text-shadow: 0 0 5px black; }

        /* 레벨업 선택창 (모달) */
        #levelup-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); display: none; 
            flex-direction: column; justify-content: center; align-items: center; 
            pointer-events: auto; z-index: 100;
        }
        .card-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .card { 
            background: #1a1a1a; border: 2px solid #8b5cf6; border-radius: 15px; 
            width: 140px; height: 200px; padding: 20px; text-align: center; color: white; 
            cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .card:hover { transform: scale(1.05); background: #2e1065; border-color: #c4b5fd; }
        .card h3 { margin: 0 0 10px 0; color: #facc15; font-size: 1.1rem; }
        .card p { font-size: 0.8rem; color: #ddd; line-height: 1.4; }
        .card-icon { font-size: 2.5rem; margin-bottom: 15px; }

        /* 게임 오버 */
        #gameover-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(50, 0, 0, 0.9); display: none; 
            flex-direction: column; justify-content: center; align-items: center; 
            color: white; pointer-events: auto; z-index: 200;
        }
        button { 
            background: white; color: black; border: none; padding: 15px 30px; 
            font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 50px; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="bar-container"><div id="xp-bar"></div></div>
        <div id="score-board">LV <span id="lv-disp">1</span> | KILLS <span id="kill-disp">0</span></div>
    </div>

    <div id="levelup-screen">
        <h2 style="color:#facc15; font-size: 2rem; margin-bottom: 10px;">LEVEL UP!</h2>
        <p style="color:#aaa;">Choose an Upgrade</p>
        <div class="card-container" id="cards"></div>
    </div>

    <div id="gameover-screen">
        <h1 style="font-size: 3rem; margin:0; color: #ef4444;">YOU DIED</h1>
        <p>Survived Lv.<span id="final-lv">0</span></p>
        <button onclick="startGame()">TRY AGAIN</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 게임 상태 변수
        let state = 'start'; // start, playing, levelup, gameover
        let width, height;
        let player, enemies, bullets, particles, xpOrbs, texts;
        let frame = 0;
        let kills = 0;
        
        // 마우스
        let mouse = { x: 0, y: 0 };

        // 플레이어 스탯 (업그레이드 가능)
        const stats = {
            hp: 100, maxHp: 100,
            speed: 3,
            dmg: 10,
            fireRate: 30, // 낮을수록 빠름
            bulletCount: 1,
            bulletSpeed: 10,
            pierce: 0 // 관통력
        };

        // 레벨 시스템
        let level = 1;
        let xp = 0;
        let xpToNext = 100;

        // 업그레이드 목록 (로그라이크의 핵심!)
        const upgradePool = [
            { id: 'multi', name: '멀티샷', icon: '🔫', desc: '총알 개수 +1 증가', func: () => stats.bulletCount++ },
            { id: 'rapid', name: '광속 연사', icon: '⚡', desc: '공격 속도 15% 증가', func: () => stats.fireRate = Math.max(5, stats.fireRate * 0.85) },
            { id: 'dmg', name: '파워 업', icon: '💥', desc: '데미지 30% 증가', func: () => stats.dmg = Math.floor(stats.dmg * 1.3) },
            { id: 'speed', name: '스피드', icon: '🏃', desc: '이동 속도 10% 증가', func: () => stats.speed *= 1.1 },
            { id: 'hp', name: '체력 돼지', icon: '❤️', desc: '최대 체력 +30 & 회복', func: () => { stats.maxHp += 30; stats.hp = stats.maxHp; } },
            { id: 'pierce', name: '관통탄', icon: '🏹', desc: '적을 1명 더 뚫음', func: () => stats.pierce++ },
            { id: 'bulletSpeed', name: '스나이퍼', icon: '🚀', desc: '탄속 증가', func: () => stats.bulletSpeed *= 1.2 }
        ];

        // 초기화
        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            mouse.x = width/2; mouse.y = height/2;
            
            player = { x: width/2, y: height/2, r: 10, color: '#8b5cf6' };
            enemies = []; bullets = []; particles = []; xpOrbs = []; texts = [];
            
            // 스탯 초기화
            stats.hp = 100; stats.maxHp = 100; stats.speed = 3;
            stats.dmg = 10; stats.fireRate = 30; stats.bulletCount = 1;
            stats.bulletSpeed = 10; stats.pierce = 0;

            level = 1; xp = 0; xpToNext = 100; kills = 0; frame = 0;
            
            updateHUD();
        }

        function startGame() {
            init();
            state = 'playing';
            document.getElementById('gameover-screen').style.display = 'none';
            document.getElementById('levelup-screen').style.display = 'none';
            loop();
        }

        // 메인 루프
        function loop() {
            if (state !== 'playing') return;
            requestAnimationFrame(loop);
            frame++;

            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)'; // 잔상 효과
            ctx.fillRect(0, 0, width, height);

            updatePlayer();
            updateBullets();
            updateEnemies();
            updateXP();
            updateParticles();
            
            drawPlayer();
        }

        // --- 업데이트 로직 ---

        function updatePlayer() {
            // 이동
            let dx = mouse.x - player.x;
            let dy = mouse.y - player.y;
            let dist = Math.hypot(dx, dy);
            
            if (dist > 5) {
                player.x += (dx / dist) * stats.speed;
                player.y += (dy / dist) * stats.speed;
            }

            // 발사 (자동)
            if (frame % Math.floor(stats.fireRate) === 0) {
                fireBullet();
            }

            // 체력바 (플레이어 밑에)
            ctx.fillStyle = 'red';
            ctx.fillRect(player.x - 15, player.y + 15, 30, 4);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(player.x - 15, player.y + 15, 30 * (stats.hp / stats.maxHp), 4);
        }

        function fireBullet() {
            // 가장 가까운 적 찾기
            let target = null;
            let minD = Infinity;
            enemies.forEach(e => {
                let d = Math.hypot(e.x - player.x, e.y - player.y);
                if (d < minD) { minD = d; target = e; }
            });

            if (!target) return; // 적 없으면 안 쏨

            let angle = Math.atan2(target.y - player.y, target.x - player.x);
            
            // 멀티샷 처리 (부채꼴)
            let cnt = stats.bulletCount;
            let startAngle = angle - (cnt - 1) * 0.1;
            
            for (let i = 0; i < cnt; i++) {
                bullets.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(startAngle + i * 0.2) * stats.bulletSpeed,
                    vy: Math.sin(startAngle + i * 0.2) * stats.bulletSpeed,
                    pierce: stats.pierce,
                    life: 100
                });
            }
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx; b.y += b.vy;
                b.life--;

                ctx.beginPath();
                ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
                ctx.fillStyle = '#facc15';
                ctx.fill();

                if (b.life <= 0 || b.x < 0 || b.x > width || b.y < 0 || b.y > height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // 적 충돌
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let d = Math.hypot(b.x - e.x, b.y - e.y);
                    if (d < e.r + 4) {
                        // 명중
                        e.hp -= stats.dmg;
                        createParticles(e.x, e.y, e.color, 3);
                        
                        if (b.pierce > 0) {
                            b.pierce--; // 관통력 감소하고 총알 유지
                        } else {
                            bullets.splice(i, 1); // 총알 삭제
                            break; 
                        }

                        if (e.hp <= 0) {
                            killEnemy(j);
                        }
                        break; 
                    }
                }
            }
        }

        function killEnemy(idx) {
            let e = enemies[idx];
            // 경험치 구슬 드롭
            xpOrbs.push({ x: e.x, y: e.y, val: e.xpVal });
            enemies.splice(idx, 1);
            kills++;
            updateHUD();
        }

        function updateEnemies() {
            // 스폰
            if (frame % Math.max(10, 60 - level * 2) === 0) {
                let r = Math.random() > 0.5 ? width : height;
                let angle = Math.random() * Math.PI * 2;
                enemies.push({
                    x: width/2 + Math.cos(angle) * (width/1.5),
                    y: height/2 + Math.sin(angle) * (width/1.5),
                    r: 10 + Math.random() * 5,
                    hp: 10 + level * 5,
                    speed: 1 + Math.random() + level * 0.1,
                    color: `hsl(${Math.random()*50}, 70%, 50%)`, // 빨강~주황 계열
                    xpVal: 10 + level * 2
                });
            }

            // 이동
            enemies.forEach(e => {
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
                ctx.fillStyle = e.color;
                ctx.fill();

                // 플레이어 피격
                let d = Math.hypot(player.x - e.x, player.y - e.y);
                if (d < player.r + e.r) {
                    stats.hp -= 0.5; // 지속 데미지
                    if (stats.hp <= 0) gameOver();
                }
            });
        }

        function updateXP() {
            for (let i = xpOrbs.length - 1; i >= 0; i--) {
                let orb = xpOrbs[i];
                
                // 자석 효과 (플레이어 가까우면 빨려옴)
                let dx = player.x - orb.x;
                let dy = player.y - orb.y;
                let dist = Math.hypot(dx, dy);

                if (dist < 150) {
                    orb.x += dx * 0.08;
                    orb.y += dy * 0.08;
                }

                // 먹음
                if (dist < 20) {
                    xp += orb.val;
                    xpOrbs.splice(i, 1);
                    checkLevelUp();
                }

                ctx.beginPath();
                ctx.arc(orb.x, orb.y, 4, 0, Math.PI*2);
                ctx.fillStyle = '#3b82f6'; // 파란 구슬
                ctx.fill();
            }
            updateHUD();
        }

        function checkLevelUp() {
            if (xp >= xpToNext) {
                xp -= xpToNext;
                level++;
                xpToNext = Math.floor(xpToNext * 1.5);
                showLevelUpScreen();
            }
        }

        function showLevelUpScreen() {
            state = 'levelup'; // 일시정지
            const screen = document.getElementById('levelup-screen');
            const container = document.getElementById('cards');
            container.innerHTML = '';

            // 랜덤 카드 3장 뽑기
            let choices = [];
            let pool = [...upgradePool];
            for (let i = 0; i < 3; i++) {
                if (pool.length === 0) break;
                let idx = Math.floor(Math.random() * pool.length);
                choices.push(pool[idx]);
                pool.splice(idx, 1); // 중복 방지
            }

            choices.forEach(card => {
                let div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<div class="card-icon">${card.icon}</div>
                                 <h3>${card.name}</h3>
                                 <p>${card.desc}</p>`;
                div.onclick = () => {
                    card.func(); // 능력 적용
                    resumeGame();
                };
                container.appendChild(div);
            });

            screen.style.display = 'flex';
        }

        function resumeGame() {
            state = 'playing';
            document.getElementById('levelup-screen').style.display = 'none';
            // 즉시 루프 재개
            loop();
        }

        function updateParticles() {
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.05;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        function createParticles(x, y, color, count) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5,
                    life: 1, size: Math.random()*3+2, color: color
                });
            }
        }

        function updateHUD() {
            document.getElementById('lv-disp').innerText = level;
            document.getElementById('kill-disp').innerText = kills;
            let pct = Math.min(100, (xp / xpToNext) * 100);
            document.getElementById('xp-bar').style.width = pct + '%';
        }

        function drawPlayer() {
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15; ctx.shadowColor = player.color;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            state = 'gameover';
            document.getElementById('final-lv').innerText = level;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        // 입력 리스너
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', e => { 
            e.preventDefault();
            mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; 
        }, {passive: false});
        window.addEventListener('resize', () => { width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight; });

        startGame(); // 시작
    </script>
</body>
</html>
