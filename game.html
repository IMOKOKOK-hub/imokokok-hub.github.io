<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Chroma-Evo: Genetic Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Consolas', monospace; }
        canvas { display: block; }

        /* UI Overlay */
        #hud {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; padding: 15px 30px;
            background: rgba(20, 20, 20, 0.8); border-radius: 50px;
            border: 1px solid #444; backdrop-filter: blur(5px);
        }

        .dna-btn {
            width: 70px; height: 70px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.1); cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .dna-btn:active { transform: scale(0.9); }
        .dna-btn.active { transform: scale(1.15); border-color: white; box-shadow: 0 0 20px currentColor; }

        .icon { font-size: 24px; margin-bottom: 2px; }
        .label { font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.7); text-transform: uppercase; }

        /* Specific Colors */
        #btn-atk { color: #ff0055; background: radial-gradient(circle, #330011, #110005); box-shadow: 0 0 10px #ff0055; }
        #btn-exp { color: #00ffaa; background: radial-gradient(circle, #003322, #001105); box-shadow: 0 0 10px #00ffaa; }
        #btn-def { color: #00aaff; background: radial-gradient(circle, #002233, #000511); box-shadow: 0 0 10px #00aaff; }

        #stats {
            position: absolute; top: 20px; left: 20px;
            color: #888; font-size: 12px; line-height: 1.6;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; pointer-events: none;
        }
        b { color: white; }
        
        #message {
            position: absolute; top: 20%; width: 100%; text-align: center;
            font-size: 14px; color: #666; pointer-events: none; opacity: 0.8;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="stats">
        <div>GEN: <b id="gen-count">0</b> 세대</div>
        <div>CELLS: <b id="cell-count">0</b></div>
        <div style="margin-top:5px; border-top:1px solid #444; padding-top:5px;">
            <span style="color:#ff0055">● 공격성</span> : 적에게 입히는 피해<br>
            <span style="color:#00ffaa">● 번식력</span> : 빈 땅으로 퍼지는 속도<br>
            <span style="color:#00aaff">● 생존력</span> : 적의 공격을 버티는 힘
        </div>
    </div>

    <div id="message">▼ DNA를 주입하여 검은 역병에 대항하는 생명체를 만드세요 ▼</div>

    <div id="hud">
        <div id="btn-atk" class="dna-btn" onclick="setMode('r')">
            <span class="icon">⚔️</span>
            <span class="label">Attack</span>
        </div>
        <div id="btn-exp" class="dna-btn active" onclick="setMode('g')">
            <span class="icon">🌱</span>
            <span class="label">Growth</span>
        </div>
        <div id="btn-def" class="dna-btn" onclick="setMode('b')">
            <span class="icon">🛡️</span>
            <span class="label">Defense</span>
        </div>
    </div>

<script>
/**
 * Chroma-Evo: Genetic Simulator
 * Logic: RGB blending dictates cell behavior.
 */

const CONFIG = {
    HEX_SIZE: 16,     // 셀 크기
    MAP_RADIUS: 20,   // 맵 크기
    TICK_RATE: 50,    // 시뮬레이션 속도 (빠름)
    PLAGUE_RATE: 0.03, // 적 생성 확률
    MUTATION_RATE: 0.05 // 돌연변이 확률
};

// RGB Helper
const Color = {
    toStr: (r, g, b) => `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`,
    mix: (c1, c2) => ({
        r: Math.min(255, (c1.r + c2.r)/2 + (Math.random()*20-10)), // 약간의 돌연변이 추가
        g: Math.min(255, (c1.g + c2.g)/2 + (Math.random()*20-10)),
        b: Math.min(255, (c1.b + c2.b)/2 + (Math.random()*20-10))
    }),
    brightness: (c) => (c.r + c.g + c.b) / 3
};

let state = {
    map: {}, 
    selectedDNA: 'g', // r, g, b
    particles: [],
    gen: 0,
    camera: { x: 0, y: 0, zoom: 1 },
    isDrag: false
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- Hex System ---
const Hex = {
    key: (q, r) => `${q},${r}`,
    neighbors: (q, r) => [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]].map(d => ({q:q+d[0], r:r+d[1]})),
    toPixel: (q, r) => ({ x: 26 * q, y: 26 * (Math.sqrt(3)/2 * q + Math.sqrt(3) * r) }), // Adjusted specific layout math
    dist: (q1, r1, q2, r2) => (Math.abs(q1-q2) + Math.abs(q1+r1-q2-r2) + Math.abs(r1-r2)) / 2
};
// Override pixel math for perfect hex grid
Hex.toPixel = (q, r) => {
    const size = CONFIG.HEX_SIZE;
    const x = size * (3/2 * q);
    const y = size * (Math.sqrt(3)/2 * q + Math.sqrt(3) * r);
    return { x, y };
};
Hex.fromPixel = (x, y) => {
    const size = CONFIG.HEX_SIZE;
    const q = (2/3 * x) / size;
    const r = (-1/3 * x + Math.sqrt(3)/3 * y) / size;
    return Hex.round(q, r);
};
Hex.round = (q, r) => {
    let s = -q-r;
    let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
    if (Math.abs(rq-q) > Math.abs(rr-r) && Math.abs(rq-q) > Math.abs(rs-s)) rq = -rr-rs;
    else if (Math.abs(rr-r) > Math.abs(rs-s)) rr = -rq-rs;
    return {q:rq, r:rr};
};

// --- Core Engine ---
function init() {
    resize();
    window.addEventListener('resize', resize);
    createMap();
    setupInput();
    setInterval(tick, CONFIG.TICK_RATE);
    requestAnimationFrame(render);
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    state.camera.x = canvas.width/2;
    state.camera.y = canvas.height/2;
}

function createMap() {
    for (let q = -CONFIG.MAP_RADIUS; q <= CONFIG.MAP_RADIUS; q++) {
        let r1 = Math.max(-CONFIG.MAP_RADIUS, -q - CONFIG.MAP_RADIUS);
        let r2 = Math.min(CONFIG.MAP_RADIUS, -q + CONFIG.MAP_RADIUS);
        for (let r = r1; r <= r2; r++) {
            state.map[Hex.key(q, r)] = {
                q, r,
                type: 'empty', // empty, cell, plague
                color: { r:0, g:0, b:0 }, // DNA
                hp: 0,
                maxHp: 0,
                age: 0
            };
        }
    }
    // Plague Seed in center
    // spawnPlague(0, 0);
}

function spawnPlague(q, r) {
    const key = Hex.key(q, r);
    if(state.map[key]) {
        const cell = state.map[key];
        cell.type = 'plague';
        cell.hp = 500;
        cell.color = {r:30, g:30, b:30};
    }
}

function spawnCell(q, r, dnaType) {
    const key = Hex.key(q, r);
    if (!state.map[key]) return;
    const cell = state.map[key];

    // Base DNA Injection
    let rVal=0, gVal=0, bVal=0;
    if (dnaType === 'r') rVal = 255;
    if (dnaType === 'g') gVal = 255;
    if (dnaType === 'b') bVal = 255;

    // 만약 이미 세포가 있다면? DNA 혼합 (Evolution)
    if (cell.type === 'cell') {
        cell.color.r = Math.min(255, cell.color.r + rVal * 0.5);
        cell.color.g = Math.min(255, cell.color.g + gVal * 0.5);
        cell.color.b = Math.min(255, cell.color.b + bVal * 0.5);
        spawnParticles(q, r, `rgb(${rVal},${gVal},${bVal})`);
    } else if (cell.type === 'empty') {
        cell.type = 'cell';
        cell.color = { r: rVal, g: gVal, b: bVal };
        cell.hp = 100;
        spawnParticles(q, r, `rgb(${rVal},${gVal},${bVal})`);
    }
}

// --- Simulation Logic (The Soul of the Game) ---
function tick() {
    state.gen++;
    const nextState = {}; // Delta changes
    let activeCells = 0;

    // Plague Spawner Logic (Dynamic Enemy)
    if (Math.random() < CONFIG.PLAGUE_RATE) {
        // Spawn plague at random edge
        const angle = Math.random() * Math.PI * 2;
        const dist = CONFIG.MAP_RADIUS;
        const q = Math.round(Math.cos(angle) * dist);
        const r = Math.round(Math.sin(angle) * dist);
        spawnPlague(q, r);
    }

    for (let key in state.map) {
        const cell = state.map[key];
        if (cell.type === 'empty') continue;
        
        activeCells++;
        
        // 1. Stats based on DNA (Color)
        // Red = Attack Dmg, Green = Reproduction Chance, Blue = MaxHP/Defense
        const dna = cell.color;
        const stats = {
            atk: 5 + (dna.r / 255) * 45,       // 5 ~ 50 damage
            repro: 0.01 + (dna.g / 255) * 0.2, // 1% ~ 21% chance
            maxHp: 50 + (dna.b / 255) * 450    // 50 ~ 500 HP
        };

        // Regulate HP cap
        if (cell.hp > stats.maxHp) cell.hp = stats.maxHp;

        const neighbors = Hex.neighbors(cell.q, cell.r);

        // --- PLAGUE LOGIC ---
        if (cell.type === 'plague') {
            // Plague just eats and spreads slowly
            neighbors.forEach(n => {
                const nKey = Hex.key(n.q, n.r);
                const target = state.map[nKey];
                if (!target) return;

                if (target.type === 'cell') {
                    // Battle: Plague attacks Cell
                    target.hp -= 10; // Base plague damage
                    // Cell strikes back (Thorns damage based on Red DNA)
                    // If cell has high Red, it hurts plague to touch it
                    const thorns = (target.color.r / 255) * 20;
                    if (thorns > 0) {
                        cell.hp -= thorns;
                        if(Math.random()<0.1) spawnParticles(n.q, n.r, '#ff0055'); // Blood effect
                    }
                    if (target.hp <= 0) nextState[nKey] = { type: 'plague', hp: 200, color: {r:30,g:30,b:30} };
                } else if (target.type === 'empty' && Math.random() < 0.05) {
                    nextState[nKey] = { type: 'plague', hp: 200, color: {r:30,g:30,b:30} };
                }
            });
            
            // Plague death
            if (cell.hp <= 0) nextState[key] = { type: 'empty' };
            continue;
        }

        // --- CELL LOGIC ---
        if (cell.type === 'cell') {
            cell.age++;
            // Natural Death (if too old and overcrowded, preventing stagnation)
            // But let's keep it simple: mainly die by Plague or Starvation logic if we added it.
            
            neighbors.forEach(n => {
                const nKey = Hex.key(n.q, n.r);
                const target = state.map[nKey];
                if (!target) return;

                // 1. Attack Plague (Red DNA)
                if (target.type === 'plague') {
                    target.hp -= stats.atk;
                    spawnParticles(n.q, n.r, '#fff', 1); // Spark
                    if (target.hp <= 0) {
                         nextState[nKey] = { type: 'empty' }; // Kill plague
                    }
                }

                // 2. Reproduction (Green DNA)
                if (target.type === 'empty') {
                    if (Math.random() < stats.repro) {
                        // Mutate color slightly
                        const childColor = Color.mix(cell.color, cell.color); 
                        nextState[nKey] = { 
                            type: 'cell', 
                            color: childColor, 
                            hp: 50 + (childColor.b/255)*450,
                            age: 0
                        };
                    }
                }
                
                // 3. Horizontal Gene Transfer (Sharing DNA with neighbors)
                // If neighbor is also cell, they average out colors slowly (Community Adaptation)
                if (target.type === 'cell' && Math.random() < 0.05) {
                    // Very subtle blending
                    const blended = Color.mix(cell.color, target.color);
                    nextState[key] = { ...cell, color: blended }; // Update self
                }
            });

            // Heal over time (Blue DNA helps regen)
            if (cell.hp < stats.maxHp) {
                cell.hp += (dna.b / 255) * 2;
            }
        }
    }

    // Apply Updates
    for (let key in nextState) {
        Object.assign(state.map[key], nextState[key]);
    }
    
    document.getElementById('cell-count').innerText = activeCells;
    document.getElementById('gen-count').innerText = state.gen;
}


// --- Rendering ---
function render() {
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(state.camera.x, state.camera.y);
    ctx.scale(state.camera.zoom, state.camera.zoom);

    for (let key in state.map) {
        const cell = state.map[key];
        // Optimization: Don't draw empty cells
        if (cell.type === 'empty') {
            // Draw faint grid
            /*
            const p = Hex.toPixel(cell.q, cell.r);
            ctx.strokeStyle = '#111';
            ctx.beginPath();
            ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
            ctx.stroke();
            */
            continue;
        }

        const pos = Hex.toPixel(cell.q, cell.r);
        const size = CONFIG.HEX_SIZE - 0.5;

        // Draw Hex
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = Math.PI / 3 * i;
            ctx.lineTo(pos.x + size * Math.cos(angle), pos.y + size * Math.sin(angle));
        }
        ctx.closePath();

        if (cell.type === 'plague') {
            ctx.fillStyle = '#222';
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();
            // Spiky inner
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, size*0.4, 0, Math.PI*2);
            ctx.fill();
        } else {
            // Cell Color
            const col = Color.toStr(cell.color.r, cell.color.g, cell.color.b);
            ctx.fillStyle = col;
            
            // Glow based on intensity
            const intensity = Color.brightness(cell.color);
            if (intensity > 150) {
                ctx.shadowColor = col;
                ctx.shadowBlur = 10;
            } else {
                ctx.shadowBlur = 0;
            }
            
            ctx.fill();
            ctx.shadowBlur = 0;

            // HP Indicator (Inner Circle Size)
            /*
            const hpPct = cell.hp / (50 + (cell.color.b/255)*450);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, size * (1-hpPct), 0, Math.PI*2);
            ctx.fill();
            */
        }
    }

    // Particles
    state.particles.forEach((p, i) => {
        p.life--;
        p.x += p.vx;
        p.y += p.vy;
        ctx.fillStyle = p.col;
        ctx.globalAlpha = p.life / 20;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        if(p.life <= 0) state.particles.splice(i, 1);
    });
    ctx.globalAlpha = 1;

    ctx.restore();
    requestAnimationFrame(render);
}

function spawnParticles(q, r, col, count=3) {
    const pos = Hex.toPixel(q, r);
    for(let i=0; i<count; i++) {
        state.particles.push({
            x: pos.x, y: pos.y,
            vx: (Math.random()-0.5)*3,
            vy: (Math.random()-0.5)*3,
            life: 20 + Math.random()*10,
            col: col,
            size: Math.random()*2 + 1
        });
    }
}

// --- Inputs ---
function setupInput() {
    canvas.addEventListener('mousedown', e => {
        state.isDrag = true;
        const h = getHex(e);
        spawnCell(h.q, h.r, state.selectedDNA);
    });
    canvas.addEventListener('mousemove', e => {
        if(state.isDrag) {
            const h = getHex(e);
            spawnCell(h.q, h.r, state.selectedDNA);
        }
    });
    window.addEventListener('mouseup', () => state.isDrag = false);
    
    canvas.addEventListener('wheel', e => {
        state.camera.zoom += e.deltaY * -0.001;
        state.camera.zoom = Math.min(Math.max(0.3, state.camera.zoom), 3);
    });
}

function getHex(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left - state.camera.x) / state.camera.zoom;
    const my = (e.clientY - rect.top - state.camera.y) / state.camera.zoom;
    return Hex.fromPixel(mx, my);
}

function setMode(mode) {
    state.selectedDNA = mode;
    document.querySelectorAll('.dna-btn').forEach(b => b.classList.remove('active'));
    let id = mode === 'r' ? 'btn-atk' : (mode === 'g' ? 'btn-exp' : 'btn-def');
    document.getElementById(id).classList.add('active');
}

// Start
init();

</script>
</body>
</html>
