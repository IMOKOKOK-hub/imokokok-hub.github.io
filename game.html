<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Prism Lord: Spectrum Defense</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Verdana', sans-serif; user-select: none; }
        canvas { display: block; }

        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .pointer-auto { pointer-events: auto; }

        #top-hud {
            position: absolute; top: 20px; width: 100%; text-align: center;
        }
        #wave-info { color: #888; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
        #xp-container {
            width: 300px; height: 6px; background: #222; margin: 10px auto; border-radius: 3px; position: relative;
        }
        #xp-bar { width: 0%; height: 100%; background: white; box-shadow: 0 0 10px white; transition: width 0.3s; }

        /* Card Drafting UI */
        #draft-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(5px);
            flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        #draft-title { font-size: 30px; color: white; margin-bottom: 40px; text-shadow: 0 0 10px #fff; }
        .card-container { display: flex; gap: 30px; }
        
        .card {
            width: 220px; height: 320px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
            cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-15px); border-color: white; box-shadow: 0 0 30px rgba(255,255,255,0.2); }
        
        .chroma-preview { width: 60px; height: 60px; border-radius: 50%; margin: 20px 0; box-shadow: 0 0 20px currentColor; }
        .card-name { font-size: 18px; color: white; font-weight: bold; margin-bottom: 10px; }
        .card-desc { font-size: 12px; color: #aaa; text-align: center; line-height: 1.5; }
        .card-stats { margin-top: auto; width: 100%; font-size: 11px; color: #666; border-top: 1px solid #333; padding-top: 10px; display: flex; justify-content: space-between; }

        /* Placement Guide */
        #placement-msg {
            display: none; position: absolute; bottom: 100px; width: 100%; text-align: center;
            color: white; font-size: 20px; text-shadow: 0 0 5px black; animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* Start Screen */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: black; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200;
        }
        button.start-btn {
            padding: 15px 40px; font-size: 20px; background: white; border: none; cursor: pointer; font-weight: bold; margin-top: 20px; letter-spacing: 2px;
            transition: all 0.3s;
        }
        button.start-btn:hover { background: #ccc; letter-spacing: 5px; }

        /* Tooltip logic for mouseover tile info */
        #tile-info {
            position: absolute; pointer-events: none; background: rgba(0,0,0,0.8); border: 1px solid #555;
            padding: 5px; color: #fff; font-size: 10px; display: none; z-index: 50;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="top-hud">
            <div id="wave-info">WAVE <span id="wave-num">1</span></div>
            <div id="xp-container"><div id="xp-bar"></div></div>
        </div>

        <div id="placement-msg">원하는 위치에 '크로마'를 배치하세요</div>
        <div id="tile-info"></div>

        <div id="start-screen" class="pointer-auto">
            <h1 style="color:white; font-size:50px; margin-bottom:0;">PRISM LORD</h1>
            <p style="color:#888; margin-bottom:40px;">Spectrum Defense</p>
            <button class="start-btn" onclick="startGame()">START</button>
        </div>

        <div id="draft-screen" class="pointer-auto">
            <div id="draft-title">SELECT CHROMA</div>
            <div class="card-container" id="card-list"></div>
        </div>
    </div>

<script>
/**
 * Prism Lord: Spectrum Defense
 * Core Logic: Inverse Square Law for Color Intensity + RGB Mixing Effects
 */

const CONFIG = {
    TILE_SIZE: 30, // Grid size
    MAP_W: 25,     // Grid Width
    MAP_H: 20,     // Grid Height
    MAX_XP: 100
};

// RGB Effects Dictionary
// Red: Damage, Green: Slow, Blue: Freeze/Stun
const COLORS = {
    R: { color: [255, 0, 0], name: 'Ruby', desc: '초당 화염 데미지를 입힙니다.' },
    G: { color: [0, 255, 0], name: 'Emerald', desc: '적의 이동속도를 늦춥니다.' },
    B: { color: [0, 80, 255], name: 'Sapphire', desc: '일정 확률로 적을 얼립니다.' },
    // Mixes handled in logic
};

let state = {
    grid: [], // 2D array of {x, y, r, g, b, totalIntensity}
    chromas: [], // Placed units {x, y, r, g, b, power, range}
    enemies: [],
    particles: [],
    wave: 1,
    xp: 0,
    maxXp: 10,
    isDrafting: false,
    isPlacing: null, // Holds the card data when placing
    lastTime: 0,
    spawnTimer: 0
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let mouse = { x: -100, y: -100, tileX: -1, tileY: -1 };

// --- Initialization ---
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    resize();
    initGrid();
    
    // Give first chroma
    levelUp();
    
    requestAnimationFrame(loop);
}

function initGrid() {
    // Center the map
    const offsetX = (canvas.width - CONFIG.MAP_W * CONFIG.TILE_SIZE) / 2;
    const offsetY = (canvas.height - CONFIG.MAP_H * CONFIG.TILE_SIZE) / 2;

    for (let y = 0; y < CONFIG.MAP_H; y++) {
        for (let x = 0; x < CONFIG.MAP_W; x++) {
            state.grid.push({
                gx: x, gy: y,
                px: offsetX + x * CONFIG.TILE_SIZE,
                py: offsetY + y * CONFIG.TILE_SIZE,
                r: 0, g: 0, b: 0,
                intensity: 0
            });
        }
    }
}

// --- Color Physics (The Core Mechanic) ---
function updateGridColors() {
    // Reset all tiles
    state.grid.forEach(t => { t.r = 0; t.g = 0; t.b = 0; t.intensity = 0; });

    // Apply Inverse Square Law for each Chroma
    state.chromas.forEach(c => {
        // Optimization: Only check tiles within range * 1.5
        // For simplicity in JS demo, iterate all (map is small enough)
        state.grid.forEach(t => {
            const dx = (t.gx - c.gx);
            const dy = (t.gy - c.gy);
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist <= c.range) {
                // Falloff formula: Intensity = Power / (Distance + 1)
                // Linear falloff feels better for games than inverse square sometimes
                const factor = Math.max(0, 1 - (dist / c.range)); // 0 to 1
                
                t.r += c.r * factor * c.power;
                t.g += c.g * factor * c.power;
                t.b += c.b * factor * c.power;
                t.intensity += factor;
            }
        });
    });

    // Clamp values
    state.grid.forEach(t => {
        t.r = Math.min(255, t.r);
        t.g = Math.min(255, t.g);
        t.b = Math.min(255, t.b);
    });
}

// --- Game Logic ---
function loop(timestamp) {
    const dt = timestamp - state.lastTime;
    state.lastTime = timestamp;

    if (!state.isDrafting && !state.isPlacing) {
        updateGame(dt);
    }
    
    draw();
    requestAnimationFrame(loop);
}

function updateGame(dt) {
    // 1. Spawning
    state.spawnTimer += dt;
    if (state.spawnTimer > Math.max(500, 2000 - state.wave * 100)) {
        spawnEnemy();
        state.spawnTimer = 0;
    }

    // 2. Enemy Logic (Movement & Effect)
    state.enemies.forEach((e, idx) => {
        // Move towards center (Map Center)
        const centerX = CONFIG.MAP_W / 2;
        const centerY = CONFIG.MAP_H / 2;
        const dx = centerX - e.gx;
        const dy = centerY - e.gy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        // Base Speed
        let speed = e.baseSpeed * (dt / 16);

        // --- Get Current Tile Color Effects ---
        // Find tile under enemy
        const tx = Math.floor(e.x / CONFIG.TILE_SIZE);
        const ty = Math.floor(e.y / CONFIG.TILE_SIZE);
        // Find specific tile object
        const tile = state.grid.find(t => t.gx === tx && t.gy === ty);

        if (tile) {
            // Apply Effects based on RGB
            
            // RED: Damage (Burn)
            if (tile.r > 20) {
                const dmg = (tile.r / 255) * 2; // Damage scales with redness
                e.hp -= dmg;
                if(Math.random()<0.1) spawnParticle(e.x, e.y, 'rgba(255,50,50,0.7)');
            }

            // GREEN: Slow (Sludge)
            if (tile.g > 20) {
                const slowFactor = Math.min(0.8, (tile.g / 255)); // Max 80% slow
                speed *= (1 - slowFactor);
                if(Math.random()<0.05) spawnParticle(e.x, e.y, 'rgba(50,255,50,0.5)');
            }

            // BLUE: Freeze (Stun chance)
            if (tile.b > 20) {
                const freezeChance = (tile.b / 255) * 0.05; // Up to 5% per frame
                if (Math.random() < freezeChance) {
                    speed = 0;
                    e.frozen = 10; // Visual indicator
                }
            }
            
            // Mixed Colors Special Effects? 
            // Yellow (R+G): Lightning chain (Simulated by bonus damage if both high)
            if (tile.r > 100 && tile.g > 100) {
                 e.hp -= 1; // Bonus burn
            }
        }

        // Apply movement
        if (dist > 0.1) {
            e.x += (dx / dist) * speed * CONFIG.TILE_SIZE * 0.005;
            e.y += (dy / dist) * speed * CONFIG.TILE_SIZE * 0.005;
            e.gx = e.x / CONFIG.TILE_SIZE; // Logical coords
            e.gy = e.y / CONFIG.TILE_SIZE;
        } else {
            // Reached center (Game Over condition normally, here just kill)
            e.hp = 0;
            // penalty?
        }

        if (e.hp <= 0) {
            state.enemies.splice(idx, 1);
            gainXp(1);
            spawnExplosion(e.x, e.y, 'white');
        }
    });

    // 3. Particles
    state.particles.forEach((p, i) => {
        p.life--;
        p.x += p.vx;
        p.y += p.vy;
        if (p.life <= 0) state.particles.splice(i, 1);
    });
}

function spawnEnemy() {
    // Spawn at random edge
    const side = Math.floor(Math.random() * 4);
    let gx, gy;
    if (side === 0) { gx = Math.random() * CONFIG.MAP_W; gy = 0; } // Top
    else if (side === 1) { gx = CONFIG.MAP_W - 1; gy = Math.random() * CONFIG.MAP_H; } // Right
    else if (side === 2) { gx = Math.random() * CONFIG.MAP_W; gy = CONFIG.MAP_H - 1; } // Bottom
    else { gx = 0; gy = Math.random() * CONFIG.MAP_H; } // Left

    // Offset for rendering
    const offsetX = (canvas.width - CONFIG.MAP_W * CONFIG.TILE_SIZE) / 2;
    const offsetY = (canvas.height - CONFIG.MAP_H * CONFIG.TILE_SIZE) / 2;

    state.enemies.push({
        gx: gx, gy: gy,
        x: gx * CONFIG.TILE_SIZE, y: gy * CONFIG.TILE_SIZE, // Local to grid
        hp: 10 + state.wave * 5,
        baseSpeed: 1.0 + (state.wave * 0.1),
        frozen: 0
    });
}

// --- Draft & Placement System ---
function gainXp(amt) {
    state.xp += amt;
    if (state.xp >= state.maxXp) {
        state.xp = 0;
        state.maxXp = Math.floor(state.maxXp * 1.5);
        state.wave++;
        levelUp();
    }
    // UI Update
    document.getElementById('xp-bar').style.width = (state.xp / state.maxXp * 100) + "%";
    document.getElementById('wave-num').innerText = state.wave;
}

function levelUp() {
    state.isDrafting = true;
    const screen = document.getElementById('draft-screen');
    const list = document.getElementById('card-list');
    list.innerHTML = '';
    screen.style.display = 'flex';

    // Generate 3 Random Cards
    for(let i=0; i<3; i++) {
        const typeKey = Object.keys(COLORS)[Math.floor(Math.random() * 3)];
        const base = COLORS[typeKey];
        
        // Random Stats
        const range = Math.floor(Math.random() * 4) + 3; // 3 to 6
        const power = (Math.random() * 0.5 + 0.5).toFixed(1); // 0.5 to 1.0

        const card = document.createElement('div');
        card.className = 'card';
        card.style.borderColor = `rgb(${base.color.join(',')})`;
        card.innerHTML = `
            <div class="card-name" style="color:rgb(${base.color.join(',')})">${base.name} Prism</div>
            <div class="chroma-preview" style="background:rgb(${base.color.join(',')}); box-shadow: 0 0 30px rgb(${base.color.join(',')})"></div>
            <div class="card-desc">${base.desc}</div>
            <div class="card-stats">
                <span>Range: ${range}</span>
                <span>Power: ${power}x</span>
            </div>
        `;
        card.onclick = () => selectCard({
            ...base, range: range, power: parseFloat(power)
        });
        list.appendChild(card);
    }
}

function selectCard(chromaData) {
    document.getElementById('draft-screen').style.display = 'none';
    state.isDrafting = false;
    state.isPlacing = chromaData;
    document.getElementById('placement-msg').style.display = 'block';
}

// Mouse Handlers for Placement
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;

    // Calculate grid pos
    const offsetX = (canvas.width - CONFIG.MAP_W * CONFIG.TILE_SIZE) / 2;
    const offsetY = (canvas.height - CONFIG.MAP_H * CONFIG.TILE_SIZE) / 2;
    
    mouse.tileX = Math.floor((mouse.x - offsetX) / CONFIG.TILE_SIZE);
    mouse.tileY = Math.floor((mouse.y - offsetY) / CONFIG.TILE_SIZE);

    // Update tooltip
    const info = document.getElementById('tile-info');
    if (mouse.tileX >= 0 && mouse.tileX < CONFIG.MAP_W && mouse.tileY >= 0 && mouse.tileY < CONFIG.MAP_H) {
        const t = state.grid.find(g => g.gx === mouse.tileX && g.gy === mouse.tileY);
        if (t) {
            info.style.display = 'block';
            info.style.left = (e.clientX + 15) + 'px';
            info.style.top = (e.clientY + 15) + 'px';
            info.innerHTML = `R:${Math.floor(t.r)} G:${Math.floor(t.g)} B:${Math.floor(t.b)}`;
        }
    } else {
        info.style.display = 'none';
    }
});

canvas.addEventListener('mousedown', () => {
    if (state.isPlacing && mouse.tileX >= 0 && mouse.tileX < CONFIG.MAP_W && mouse.tileY >= 0 && mouse.tileY < CONFIG.MAP_H) {
        // Place Chroma
        state.chromas.push({
            gx: mouse.tileX, gy: mouse.tileY,
            r: state.isPlacing.color[0],
            g: state.isPlacing.color[1],
            b: state.isPlacing.color[2],
            range: state.isPlacing.range,
            power: state.isPlacing.power
        });

        // Recalculate World Colors
        updateGridColors();
        
        // Reset UI
        state.isPlacing = null;
        document.getElementById('placement-msg').style.display = 'none';
        
        // Effect
        spawnExplosion(mouse.tileX * CONFIG.TILE_SIZE, mouse.tileY * CONFIG.TILE_SIZE, 'white');
    }
});


// --- Drawing ---
function draw() {
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Grid (Tiles)
    // We draw only the active grid area
    const offsetX = (canvas.width - CONFIG.MAP_W * CONFIG.TILE_SIZE) / 2;
    const offsetY = (canvas.height - CONFIG.MAP_H * CONFIG.TILE_SIZE) / 2;

    ctx.save();
    ctx.translate(offsetX, offsetY);

    state.grid.forEach(t => {
        // Optimization: Don't fill black tiles, just stroke lightly
        if (t.intensity > 0.05) {
            ctx.fillStyle = `rgb(${t.r}, ${t.g}, ${t.b})`;
            // Add a glow effect based on intensity
            ctx.shadowColor = `rgb(${t.r}, ${t.g}, ${t.b})`;
            ctx.shadowBlur = t.intensity * 10;
        } else {
            ctx.fillStyle = '#111';
            ctx.shadowBlur = 0;
        }
        
        ctx.fillRect(t.gx * CONFIG.TILE_SIZE, t.gy * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE - 1, CONFIG.TILE_SIZE - 1);
    });
    ctx.shadowBlur = 0; // reset

    // 2. Draw Chromas (The Units)
    state.chromas.forEach(c => {
        const cx = c.gx * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2;
        const cy = c.gy * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2;
        
        // Glowy circle
        ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
        ctx.beginPath();
        ctx.arc(cx, cy, CONFIG.TILE_SIZE * 0.4, 0, Math.PI*2);
        ctx.fill();
        
        // Inner white core
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(cx, cy, CONFIG.TILE_SIZE * 0.15, 0, Math.PI*2);
        ctx.fill();

        // Range Ring (faint)
        ctx.strokeStyle = `rgba(${c.r},${c.g},${c.b}, 0.2)`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, c.range * CONFIG.TILE_SIZE, 0, Math.PI*2);
        ctx.stroke();
    });

    // 3. Draw Enemies
    state.enemies.forEach(e => {
        ctx.fillStyle = e.frozen ? '#00ffff' : '#888'; // Grey void monsters or frozen
        ctx.beginPath();
        // Triangle shape pointing to center? Just circle for now
        ctx.arc(e.x + CONFIG.TILE_SIZE/2, e.y + CONFIG.TILE_SIZE/2, CONFIG.TILE_SIZE * 0.3, 0, Math.PI*2);
        ctx.fill();
        
        // HP Bar
        ctx.fillStyle = 'red';
        ctx.fillRect(e.x, e.y - 5, CONFIG.TILE_SIZE, 3);
        ctx.fillStyle = 'lime';
        ctx.fillRect(e.x, e.y - 5, CONFIG.TILE_SIZE * (e.hp / (10 + state.wave * 5)), 3);
    });

    // 4. Placement Ghost
    if (state.isPlacing && mouse.tileX >= 0 && mouse.tileX < CONFIG.MAP_W) {
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.strokeRect(mouse.tileX * CONFIG.TILE_SIZE, mouse.tileY * CONFIG.TILE_SIZE, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
        
        // Preview Range
        ctx.beginPath();
        ctx.arc(mouse.tileX * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, mouse.tileY * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, state.isPlacing.range * CONFIG.TILE_SIZE, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    ctx.restore();

    // 5. Particles (Screen Space)
    ctx.save();
    ctx.translate(offsetX, offsetY); // Particles are in local coords in this simplified system
    state.particles.forEach(p => {
        ctx.fillStyle = p.col;
        ctx.globalAlpha = p.life / 30;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });
    ctx.restore();
}

function spawnParticle(x, y, col) {
    state.particles.push({
        x: x + CONFIG.TILE_SIZE/2, y: y + CONFIG.TILE_SIZE/2,
        vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
        life: 30, size: Math.random()*3+1, col: col
    });
}
function spawnExplosion(x, y, col) {
    for(let i=0; i<10; i++) spawnParticle(x, y, col);
}

</script>
</body>
</html>
