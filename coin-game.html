<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Pump Battle</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f172a; /* 짙은 남색 배경 (차트 느낌) */
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { 
            color: #22c55e; /* 상승색(초록) */
            margin-bottom: 5px; 
            font-size: 1.8rem; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p { color: #94a3b8; margin-bottom: 30px; }

        .battle-arena {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .fighter-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 15px;
            padding: 20px;
            width: 45%;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .fighter-card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6;
        }
        .fighter-card img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
            border-radius: 50%;
        }
        .coin-name { font-size: 1.1rem; font-weight: bold; display: block; margin-bottom: 5px;}
        .coin-symbol { color: #64748b; font-size: 0.9rem; text-transform: uppercase; }

        .vs { font-size: 1.5rem; font-weight: bold; color: #facc15; font-style: italic; }

        /* 결과 표시용 (평소엔 숨김) */
        .percent {
            display: none;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 10px;
        }
        
        /* 정답/오답 스타일 */
        .winner { border-color: #22c55e !important; background: rgba(34, 197, 94, 0.1); }
        .loser { border-color: #ef4444 !important; opacity: 0.6; }
        .text-up { color: #22c55e; }
        .text-down { color: #ef4444; }

        #score-board {
            margin-top: 30px;
            font-size: 1.2rem;
            background: #334155;
            padding: 5px 15px;
            border-radius: 20px;
        }
        
        #loading { margin-top: 50px; font-size: 1.2rem; color: #facc15; }
        
        #next-btn {
            background: #facc15;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            margin-top: 30px;
            cursor: pointer;
            display: none;
            animation: pop 0.3s;
        }
        @keyframes pop { from {transform: scale(0.8);} to {transform: scale(1);} }

    </style>
</head>
<body>

    <h1>🚀 Who Pumped More?</h1>
    <p>Which coin gained more in the last 24h?</p>

    <div id="loading">📊 Loading Market Data...</div>

    <div class="battle-arena" id="game-area" style="display:none;">
        <div class="fighter-card" id="card-left" onclick="choose('left')">
            <img id="img-left" src="" alt="Coin A">
            <span class="coin-name" id="name-left">BTC</span>
            <span class="coin-symbol" id="symbol-left">Bitcoin</span>
            <div class="percent" id="perc-left">0.00%</div>
        </div>

        <div class="vs">VS</div>

        <div class="fighter-card" id="card-right" onclick="choose('right')">
            <img id="img-right" src="" alt="Coin B">
            <span class="coin-name" id="name-right">ETH</span>
            <span class="coin-symbol" id="symbol-right">Ethereum</span>
            <div class="percent" id="perc-right">0.00%</div>
        </div>
    </div>

    <div id="score-board" style="display:none;">Score: <span id="score">0</span></div>
    <div id="result-msg" style="margin-top:15px; font-weight:bold; height:20px;"></div>
    
    <button id="next-btn" onclick="nextRound()">Next Battle ➡</button>

    <script>
        // ✅ CoinGecko 무료 API (상위 50개 코인 데이터 한방에 가져오기)
        const API_URL = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50&page=1&sparkline=false";
        
        let allCoins = [];
        let coinA, coinB;
        let score = 0;
        let isAnswered = false;

        // 1. 데이터 가져오기
        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                allCoins = await res.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('game-area').style.display = 'flex';
                document.getElementById('score-board').style.display = 'block';
                
                nextRound();
            } catch (err) {
                document.getElementById('loading').innerText = "API Error! Too many requests. Wait 1 min.";
            }
        }

        // 2. 게임 라운드 세팅
        function nextRound() {
            isAnswered = false;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('result-msg').innerText = '';

            // 스타일 초기화
            resetCard('card-left', 'perc-left');
            resetCard('card-right', 'perc-right');

            // 랜덤 코인 2개 뽑기 (서로 다른 것)
            let idx1 = Math.floor(Math.random() * allCoins.length);
            let idx2 = Math.floor(Math.random() * allCoins.length);
            while(idx1 === idx2) { idx2 = Math.floor(Math.random() * allCoins.length); }

            coinA = allCoins[idx1];
            coinB = allCoins[idx2];

            // 화면에 뿌리기
            updateCard('left', coinA);
            updateCard('right', coinB);
        }

        function updateCard(side, coin) {
            document.getElementById(`img-${side}`).src = coin.image;
            document.getElementById(`name-${side}`).innerText = coin.name;
            document.getElementById(`symbol-${side}`).innerText = coin.symbol.toUpperCase();
            
            // 퍼센트 미리 세팅 (보이진 않음)
            const pDiv = document.getElementById(`perc-${side}`);
            let p = coin.price_change_percentage_24h;
            pDiv.innerText = (p > 0 ? "+" : "") + p.toFixed(2) + "%";
            pDiv.className = "percent " + (p >= 0 ? "text-up" : "text-down");
        }

        function resetCard(cardId, percId) {
            const card = document.getElementById(cardId);
            card.classList.remove('winner', 'loser');
            document.getElementById(percId).style.display = 'none';
        }

        // 3. 정답 선택
        function choose(side) {
            if (isAnswered) return;
            isAnswered = true;

            // 퍼센트 공개
            document.getElementById('perc-left').style.display = 'block';
            document.getElementById('perc-right').style.display = 'block';

            const valA = coinA.price_change_percentage_24h;
            const valB = coinB.price_change_percentage_24h;

            let winnerSide = '';
            if (valA > valB) winnerSide = 'left';
            else winnerSide = 'right';

            // 결과 판정
            if (side === winnerSide) {
                // 정답
                score++;
                document.getElementById('result-msg').innerHTML = "✅ Nice Trading Instinct!";
                document.getElementById('result-msg').style.color = "#22c55e";
                document.getElementById(`card-${side}`).classList.add('winner');
            } else {
                // 오답
                document.getElementById('result-msg').innerHTML = "❌ Rekt! Market is cruel.";
                document.getElementById('result-msg').style.color = "#ef4444";
                document.getElementById(`card-${side}`).classList.add('loser');
                document.getElementById(`card-${winnerSide}`).classList.add('winner'); // 진짜 승자 보여줌
            }

            document.getElementById('score').innerText = score;
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        // 시작
        fetchData();

    </script>
</body>
</html>
