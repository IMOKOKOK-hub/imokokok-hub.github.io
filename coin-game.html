<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni-Trader Terminal</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
        
        /* 레이아웃 그리드 */
        .grid-container {
            display: grid;
            grid-template-columns: 2.5fr 1fr; /* 왼쪽 차트 크게, 오른쪽 정보 작게 */
            grid-template-rows: 50px 600px 1fr; /* 상단띠 / 메인 / 하단 */
            gap: 5px;
            height: 100vh;
            padding: 5px;
            box-sizing: border-box;
        }

        /* 구역별 스타일 */
        .header-ticker { grid-column: 1 / -1; }
        .main-chart { background: #111; border-radius: 5px; overflow: hidden; }
        .side-panel { display: flex; flex-direction: column; gap: 5px; }
        .bottom-panel { grid-column: 1 / -1; height: 400px; background: #111; border-radius: 5px; overflow: hidden; }

        /* 모바일 대응 */
        @media (max-width: 768px) {
            .grid-container { display: flex; flex-direction: column; height: auto; }
            .main-chart, .side-panel, .bottom-panel { height: 400px; width: 100%; }
        }
    </style>
</head>
<body>

    <div class="grid-container">
        
        <div class="header-ticker">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
                {
                "symbols": [
                    { "proName": "BITSTAMP:BTCUSD", "title": "비트코인" },
                    { "proName": "BITSTAMP:ETHUSD", "title": "이더리움" },
                    { "description": "환율(USD/KRW)", "proName": "FX_IDC:USDKRW" },
                    { "description": "나스닥", "proName": "FOREXCOM:NAS100" },
                    { "description": "S&P 500", "proName": "FOREXCOM:SPX500" },
                    { "description": "코스피", "proName": "KRX:KOSPI" }
                ],
                "showSymbolLogo": true,
                "colorTheme": "dark",
                "isTransparent": false,
                "displayMode": "adaptive",
                "locale": "kr"
                }
                </script>
            </div>
        </div>

        <div class="main-chart">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                {
                "autosize": true,
                "symbol": "UPBIT:BTCKRW",
                "interval": "D",
                "timezone": "Asia/Seoul",
                "theme": "dark",
                "style": "1",
                "locale": "kr",
                "enable_publishing": false,
                "backgroundColor": "rgba(0, 0, 0, 1)",
                "gridColor": "rgba(66, 66, 66, 0.06)",
                "allow_symbol_change": true,
                "calendar": false,
                "support_host": "https://www.tradingview.com"
                }
                </script>
            </div>
        </div>

        <div class="side-panel">
            <div style="flex:1; background:#111; border-radius:5px; overflow:hidden;">
                <div class="tradingview-widget-container" style="height:100%;width:100%">
                    <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                    {
                    "interval": "1m",
                    "width": "100%",
                    "isTransparent": false,
                    "height": "100%",
                    "symbol": "UPBIT:BTCKRW",
                    "showIntervalTabs": true,
                    "displayMode": "single",
                    "locale": "kr",
                    "colorTheme": "dark"
                    }
                    </script>
                </div>
            </div>

            <div style="flex:1; background:#111; border-radius:5px; overflow:hidden;">
                 <div class="tradingview-widget-container" style="height:100%;width:100%">
                    <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                    {
                    "feedMode": "all_symbols",
                    "isTransparent": false,
                    "displayMode": "regular",
                    "width": "100%",
                    "height": "100%",
                    "colorTheme": "dark",
                    "locale": "kr"
                    }
                    </script>
                </div>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-crypto-coins-heatmap.js" async>
                {
                "dataSource": "Crypto",
                "blockSize": "market_cap_calc",
                "blockColor": "change",
                "locale": "kr",
                "symbolUrl": "",
                "colorTheme": "dark",
                "hasTopBar": false,
                "isDataSetEnabled": false,
                "isWidget": true,
                "autoSize": true,
                "width": "100%",
                "height": "100%",
                "profitability": "change_percent_24h"
                }
                </script>
            </div>
        </div>

    </div>
</body>
</html>
