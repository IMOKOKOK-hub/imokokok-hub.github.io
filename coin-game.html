<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개미용 블대리 (Lite)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --up-color: #ef4444; /* 한국식 상승: 빨강 */
            --down-color: #3b82f6; /* 한국식 하락: 파랑 */
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { margin: 0 0 20px 0; font-size: 1.5rem; border-bottom: 2px solid #334155; padding-bottom: 10px; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .panel h2 { margin-top: 0; font-size: 1.1rem; color: #fbbf24; margin-bottom: 15px; }

        /* 코인 리스트 스타일 */
        .coin-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
            font-size: 1rem;
        }
        .price-up { color: var(--up-color); font-weight: bold; }
        .price-down { color: var(--down-color); font-weight: bold; }

        /* 뉴스 스타일 */
        .news-item {
            display: block;
            padding: 10px 0;
            border-bottom: 1px dashed #334155;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
        }
        .news-item:hover { color: #fbbf24; text-decoration: underline; }
        .news-date { font-size: 0.8rem; color: var(--text-sub); display: block; margin-top: 4px; }

        /* 로딩 애니메이션 */
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <h1>🐜 개미용 블대리 <span style="font-size:0.9rem; color:#94a3b8; font-weight:normal;">(HTML Ver.)</span></h1>

    <div class="dashboard">
        
        <div class="panel">
            <h2>🚀 실시간 급등 코인 (KRW 환산)</h2>
            <div id="coin-list" class="blink">데이터 수신중...</div>
        </div>

        <div class="panel">
            <h2>📰 코인판 주요 뉴스</h2>
            <div id="news-list">뉴스 불러오는 중...</div>
        </div>

        <div class="panel" style="text-align:center;">
            <h2>😱 공포 vs 탐욕 지수</h2>
            <img src="https://alternative.me/crypto/fear-and-greed-index.png" alt="Fear & Greed Index" style="width:100%; border-radius:10px;">
            <p style="color:#94a3b8; font-size:0.9rem; margin-top:10px;">매일 갱신됩니다.</p>
        </div>

    </div>

    <script>
        // 1. 코인 가격 가져오기 (CoinGecko API - 무료/공개)
        async function getPrices() {
            const listDiv = document.getElementById('coin-list');
            try {
                // 비트, 이더, 리플, 솔라나, 도지
                const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=krw&ids=bitcoin,ethereum,ripple,solana,dogecoin&order=market_cap_desc');
                const data = await response.json();
                
                listDiv.innerHTML = ''; // 초기화
                listDiv.classList.remove('blink');

                data.forEach(coin => {
                    const pChange = coin.price_change_percentage_24h;
                    const colorClass = pChange >= 0 ? 'price-up' : 'price-down';
                    const sign = pChange >= 0 ? '+' : '';
                    
                    const html = `
                        <div class="coin-item">
                            <span>
                                <img src="${coin.image}" style="width:20px; vertical-align:middle; margin-right:5px;">
                                ${coin.name}
                            </span>
                            <span class="${colorClass}">
                                ${coin.current_price.toLocaleString()}원 (${sign}${pChange.toFixed(2)}%)
                            </span>
                        </div>
                    `;
                    listDiv.innerHTML += html;
                });
            } catch (err) {
                listDiv.innerText = "API 호출 제한됨 (잠시 후 새로고침)";
            }
        }

        // 2. 뉴스 가져오기 (RSS to JSON API 사용 - 우회법)
        async function getNews() {
            const newsDiv = document.getElementById('news-list');
            // 구글 뉴스 '가상화폐' 키워드 검색 결과 RSS
            const rssUrl = "https://news.google.com/rss/search?q=가상화폐+OR+비트코인&hl=ko&gl=KR&ceid=KR:ko";
            // RSS를 JSON으로 바꿔주는 무료 API (rss2json)
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

            try {
                const res = await fetch(apiUrl);
                const data = await res.json();
                const items = data.items.slice(0, 5); // 5개만

                newsDiv.innerHTML = '';
                items.forEach(item => {
                    const html = `
                        <a href="${item.link}" target="_blank" class="news-item">
                            ${item.title}
                            <span class="news-date">${item.pubDate.split(' ')[0]}</span>
                        </a>
                    `;
                    newsDiv.innerHTML += html;
                });
            } catch (err) {
                newsDiv.innerText = "뉴스 로딩 실패";
            }
        }

        // 실행
        getPrices();
        getNews();

        // 10초마다 시세 갱신
        setInterval(getPrices, 10000);

    </script>
</body>
</html>
